<svg xmlns="http://www.w3.org/2000/svg" width="340" height="590" viewBox="0 0 340 590" role="img" aria-labelledby="title desc">
<title id="title">Os períodos publicados pela NASA em abril e outubro de 1963</title>
<desc id="desc">1963 3A permaneceu em 94,6 minutos; 1963 3B passou de 94,1 para 92,4, menos 1,7; 1963 3C passou de 94,3 para 93,3, menos 1,0. Não são épocas instrumentais.</desc>
