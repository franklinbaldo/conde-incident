<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
<title>{% block title %}{{ config.title }}{% endblock title %}</title>
<link rel="stylesheet" href="{{ get_url(path='css/site.css') | safe }}">
</head>
<body>
<header class="masthead"><div class="wrap masthead-inner">
<a class="brand" href="{{ config.base_url | safe }}"><small>Arquivo de investigação</small><strong>Conde, 1963</strong></a>
<nav aria-label="Navegação principal">
<a href="{{ config.base_url | safe }}stories/">Reportagens</a>
<a href="{{ config.base_url | safe }}lab/">Laboratório científico</a>
</nav>
</div></header>
<main class="wrap">{% block content %}{% endblock content %}</main>
<footer class="site-footer"><div class="wrap">
<p>Um relato documentado não equivale a uma ocorrência comprovada. As hipóteses continuam abertas.</p>
<p>Fontes e versões: <a href="https://github.com/franklinbaldo/conde-incident">repositório Conde</a>.</p>
</div></footer>
</body></html>
