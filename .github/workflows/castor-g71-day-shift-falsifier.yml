name: Castor G71 independent NASA-day shift falsifier
on:
  pull_request:
    paths:
      - tools/c241_fixed_h_day_shift_G71.py
      - tests/test_c241_fixed_h_day_shift_G71.py
      - research/statistics/C241_G71_INDEPENDENT_DAY_SHIFT_FALSIFIER_20261114.md
      - .github/workflows/castor-g71-day-shift-falsifier.yml
      - tools/c241_king_hele_fixed_h_falsifier.py
      - tools/c241_king_hele_day_holdout.py
      - tools/c241_637_regime_holdout.py
      - tests/test_c241_g71_workflow_coverage.py
  push:
    branches: [main]
    paths:
      - tools/c241_fixed_h_day_shift_G71.py
      - tests/test_c241_fixed_h_day_shift_G71.py
      - research/statistics/C241_G71_INDEPENDENT_DAY_SHIFT_FALSIFIER_20261114.md
      - .github/workflows/castor-g71-day-shift-falsifier.yml
      - tools/c241_king_hele_fixed_h_falsifier.py
      - tools/c241_king_hele_day_holdout.py
      - tools/c241_637_regime_holdout.py
      - tests/test_c241_g71_workflow_coverage.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g71-fixed-h-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out SHA
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial controls, normal and optimized
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_c241_fixed_h_day_shift_G71.py' -v
          python3 -O -m unittest discover -s tests -p 'test_c241_fixed_h_day_shift_G71.py' -v
          python3 -m unittest discover -s tests -p 'test_c241_g71_workflow_coverage.py' -v
          python3 -O -m unittest discover -s tests -p 'test_c241_g71_workflow_coverage.py' -v
      - name: Replay pinned historical Parquet, assert negative result
        run: |
          set -euo pipefail
          python3 -m pip install pyarrow==21.0.0
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
            https://huggingface.co/datasets/oxzoid/space-track-tle-history/resolve/4b4fb3a/data/tle_1963.parquet \
            -o "$RUNNER_TEMP/tle_1963.parquet"
          echo 'c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09' " $RUNNER_TEMP/tle_1963.parquet" | sha256sum -c -
          python3 tools/c241_fixed_h_day_shift_G71.py \
            --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --output "$RUNNER_TEMP/g71.json"
          python3 - "$RUNNER_TEMP/g71.json" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding='utf-8'))
          assert p['source']['sha256_verified_by_reader'] == 'c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09'
          for v in ('last_two', 'median_three'):
              a = p['objects']['637']['variants'][v]
              assert a['status'] == 'CERTIFIED_INCOMPATIBLE_WITH_INDEPENDENT_DATE_SHIFTS'
              assert a['cutoffs'] == 4 and a['separation_after_expansion_km'] > 0
              assert a['infimum_offset_days_before_common_H_possible'] > 1
              assert p['objects']['528']['variants'][v]['status'] == 'NOT_ESTIMABLE_SINGLE_CUTOFF'
          assert p['inference']['active_constraint'] is False
          assert p['inference']['impact_geography'] is None
          assert p['inference']['historical_mcmc'] == 'NOT_RUN'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c241-g71-${{ github.sha }}
          path: ${{ runner.temp }}/g71.json
          if-no-files-found: error
          retention-days: 30
