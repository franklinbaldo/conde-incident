name: CGEO-68 article-boundary adjudication
on:
  pull_request:
    paths:
      - 'research/editorial/cgeo68_uh_article_boundary_20261115.json'
      - 'tools/cgeo68_uh_article_boundary_validate.py'
      - 'tests/test_cgeo68_uh_article_boundary.py'
      - '.github/workflows/cgeo68-uh-article-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'research/editorial/cgeo68_uh_article_boundary_20261115.json'
      - 'tools/cgeo68_uh_article_boundary_validate.py'
      - 'tests/test_cgeo68_uh_article_boundary.py'
      - '.github/workflows/cgeo68-uh-article-boundary.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact commit and frozen registration
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object research/editorial/cgeo64_null_narrative_prereg_20261114.json)" = "0d13d9359080699e5f8402ca9b7014d7f1f6d59a"
      - name: Verify visual adjudication contract and negative controls
        run: |
          python3 tools/cgeo68_uh_article_boundary_validate.py
          python3 -m unittest discover -s tests -p 'test_cgeo68_uh_article_boundary.py' -v
          python3 -O -m unittest discover -s tests -p 'test_cgeo68_uh_article_boundary.py' -v
