name: Tartaruga - C241-L23 NASA Apr 10 listing gap custody
on:
  pull_request:
    paths:
      - tools/tle_nasa_ssr_apr10_audit.py
      - tests/test_tle_nasa_ssr_apr10_audit.py
      - research/tle_custody/nasa_ssr_apr10_listing_C241-L23.json
      - research/constraints/ssr_apr10_listing_C241-L23.json
      - research/tle_custody/evidence_matrix_C241-L23_2026-11-13.md
      - .github/workflows/tle-nasa-ssr-apr10.yml
  push:
    branches: [main]
    paths:
      - tools/tle_nasa_ssr_apr10_audit.py
      - tests/test_tle_nasa_ssr_apr10_audit.py
      - research/tle_custody/nasa_ssr_apr10_listing_C241-L23.json
      - research/constraints/ssr_apr10_listing_C241-L23.json
      - research/tle_custody/evidence_matrix_C241-L23_2026-11-13.md
      - .github/workflows/tle-nasa-ssr-apr10.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify head and scientific controls
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p test_tle_nasa_ssr_apr10_audit.py -v
      - name: Download original NASA facsimile and verify immutable capture
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            https://ntrs.nasa.gov/api/citations/19630012127/downloads/19630012127.pdf \
            -o "$RUNNER_TEMP/19630012127.pdf"
          python3 tools/tle_nasa_ssr_apr10_audit.py --pdf "$RUNNER_TEMP/19630012127.pdf" --output "$RUNNER_TEMP/c241-l23.json"
          python3 - "$RUNNER_TEMP/c241-l23.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a['pdf_bytes_verified']==206176
          assert a['independent_instrument_measurements_added']==0
          assert a['physical_constraints_activated']==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c241-l23-apr10-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l23.json
          if-no-files-found: warn
          retention-days: 30
