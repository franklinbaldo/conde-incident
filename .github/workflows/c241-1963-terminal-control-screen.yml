name: C241 historical terminal-control archive screen
on:
  pull_request:
    paths:
      - tools/c241_1963_terminal_control_screen.py
      - tests/test_c241_1963_terminal_control_screen.py
      - research/statistics/C241_1963_TERMINAL_CONTROL_SCREEN_20261114.md
      - .github/workflows/c241-1963-terminal-control-screen.yml
  push:
    branches: [main]
    paths:
      - tools/c241_1963_terminal_control_screen.py
      - tests/test_c241_1963_terminal_control_screen.py
      - research/statistics/C241_1963_TERMINAL_CONTROL_SCREEN_20261114.md
      - .github/workflows/c241-1963-terminal-control-screen.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-leads-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "tested_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic adversarial tests (normal and optimized)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_c241_1963_terminal_control_screen.py -v
          python3 -O -m unittest discover -s tests -p test_c241_1963_terminal_control_screen.py -v
      - name: Replay pinned secondary archive and negative provenance check
        run: |
          set -euo pipefail
          python3 -m pip install pyarrow==21.0.0
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
            https://huggingface.co/datasets/oxzoid/space-track-tle-history/resolve/4b4fb3a/data/tle_1963.parquet \
            -o "$RUNNER_TEMP/tle_1963.parquet"
          echo 'c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09  '"$RUNNER_TEMP/tle_1963.parquet" | sha256sum -c -
          python3 tools/c241_1963_terminal_control_screen.py --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --output "$RUNNER_TEMP/c241-1963-terminal-controls.json" --check
          printf 'damaged archive' > "$RUNNER_TEMP/mutant.parquet"
          if python3 tools/c241_1963_terminal_control_screen.py --parquet "$RUNNER_TEMP/mutant.parquet" \
               --output "$RUNNER_TEMP/should-not-exist.json" --check 2>"$RUNNER_TEMP/negative.log"; then
            echo "FAIL: corrupted archive incorrectly passed"
            exit 1
          fi
          grep -q 'SHA-256 mismatch' "$RUNNER_TEMP/negative.log"
          test ! -e "$RUNNER_TEMP/should-not-exist.json"
          python3 - "$RUNNER_TEMP/c241-1963-terminal-controls.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['archive_search_priority_norad']==[292,308,565,668]
          assert {r['norad']:r['catalogue_unique_epochs'] for r in x['cases']}=={
             292:53,308:52,565:31,668:10,637:25,688:1,528:45}
          assert all(not r['terminal_holdout_ready'] for r in x['cases'])
          assert all(not r['terminal_time_error_calibrated'] for r in x['cases'])
          assert x['inference']['historical_mcmc']=='NOT_RUN'
          assert x['inference']['active_constraint_528'] is False
          assert x['inference']['impact_probability'] is None
          print('7 objects; 4 archival leads; 0 calibrated terminal holdouts; negative PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c241-terminal-control-screen-${{ github.sha }}
          path: ${{ runner.temp }}/c241-1963-terminal-controls.json
          if-no-files-found: error
          retention-days: 30
