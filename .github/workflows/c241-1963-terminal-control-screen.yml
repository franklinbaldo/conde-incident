name: C241 historical terminal-control archive screen
on:
  pull_request:
    paths:
      - tools/c241_1963_terminal_control_screen.py
      - tools/c241_1963_archive_fixed_h_stress.py
      - tools/c241_308_ssr_calendar_range_r61.py
      - tools/c241_terminal_calendar_minimax_r62.py
      - tests/test_c241_1963_terminal_control_screen.py
      - tests/test_c241_1963_archive_fixed_h_stress.py
      - tests/test_c241_308_ssr_calendar_range_r61.py
      - tests/test_c241_terminal_calendar_minimax_r62.py
      - research/statistics/C241_1963_TERMINAL_CONTROL_SCREEN_20261114.md
      - research/statistics/C241_1963_ARCHIVE_FIXED_H_STRESS_20261114.md
      - research/statistics/C241_SSR_308_CALENDAR_RANGE_R61_20261114.md
      - research/statistics/C241_TERMINAL_CALENDAR_MINIMAX_R62_20261114.md
      - research/tle_custody/nasa_ssr_terminal_control_308_C241-L64.json
      - tools/c241_omega1_308_crosssource_r65.py
      - tests/test_c241_omega1_308_crosssource_r65.py
      - research/statistics/C241_OMEGA1_308_CROSSSOURCE_R65_20261114.md
      - tools/c241_un_omega_registry_alias_r66.py
      - tests/test_c241_un_omega_registry_alias_r66.py
      - research/statistics/C241_UN_OMEGA_REGISTRATION_R66_20261114.md
      - research/tle_custody/c241_un_omega_registry_leads_r66.json
      - tools/c241_omega_print_quantization_r67.py
      - tests/test_c241_omega_print_quantization_r67.py
      - research/statistics/C241_OMEGA_PRINT_QUANTIZATION_R67_20261114.md
      - tools/c241_decay_day_error_r68.py
      - tests/test_c241_decay_day_error_r68.py
      - research/statistics/C241_UNIFIED_DECAY_DAY_ERRORS_R68_20261115.md
      - .github/workflows/c241-1963-terminal-control-screen.yml
  push:
    branches: [main]
    paths:
      - tools/c241_1963_terminal_control_screen.py
      - tools/c241_1963_archive_fixed_h_stress.py
      - tools/c241_308_ssr_calendar_range_r61.py
      - tools/c241_terminal_calendar_minimax_r62.py
      - tests/test_c241_1963_terminal_control_screen.py
      - tests/test_c241_1963_archive_fixed_h_stress.py
      - tests/test_c241_308_ssr_calendar_range_r61.py
      - tests/test_c241_terminal_calendar_minimax_r62.py
      - research/statistics/C241_1963_TERMINAL_CONTROL_SCREEN_20261114.md
      - research/statistics/C241_1963_ARCHIVE_FIXED_H_STRESS_20261114.md
      - research/statistics/C241_SSR_308_CALENDAR_RANGE_R61_20261114.md
      - research/statistics/C241_TERMINAL_CALENDAR_MINIMAX_R62_20261114.md
      - research/tle_custody/nasa_ssr_terminal_control_308_C241-L64.json
      - tools/c241_omega1_308_crosssource_r65.py
      - tests/test_c241_omega1_308_crosssource_r65.py
      - research/statistics/C241_OMEGA1_308_CROSSSOURCE_R65_20261114.md
      - tools/c241_un_omega_registry_alias_r66.py
      - tests/test_c241_un_omega_registry_alias_r66.py
      - research/statistics/C241_UN_OMEGA_REGISTRATION_R66_20261114.md
      - research/tle_custody/c241_un_omega_registry_leads_r66.json
      - tools/c241_omega_print_quantization_r67.py
      - tests/test_c241_omega_print_quantization_r67.py
      - research/statistics/C241_OMEGA_PRINT_QUANTIZATION_R67_20261114.md
      - tools/c241_decay_day_error_r68.py
      - tests/test_c241_decay_day_error_r68.py
      - research/statistics/C241_UNIFIED_DECAY_DAY_ERRORS_R68_20261115.md
      - .github/workflows/c241-1963-terminal-control-screen.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-leads-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "tested_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic adversarial tests (normal and optimized)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_c241_un_omega_registry_alias_r66.py -v
          python3 -m unittest discover -s tests -p test_c241_omega_print_quantization_r67.py -v
          python3 -O -m unittest discover -s tests -p test_c241_omega_print_quantization_r67.py -v
          python3 -O -m unittest discover -s tests -p test_c241_un_omega_registry_alias_r66.py -v
          python3 tools/c241_un_omega_registry_alias_r66.py --record research/tle_custody/c241_un_omega_registry_leads_r66.json --output "$RUNNER_TEMP/c241-r66.json"
          python3 - "$RUNNER_TEMP/c241-r66.json" <<'PY_R66'
          import json,sys
          x=json.load(open(sys.argv[1], encoding="utf-8"))
          assert x["schema"]=="conde.c241.un-omega-alias-audit.r66/v1"
          assert x["registration_roles"]["1962 Omega 2"]=="FRAGMENT"
          assert x["un_omega1_decay_report"]["event_utc_time"] is None
          assert x["independent_terminal_holdouts_added"]==0
          assert x["date_alignment_is_calibrated_utc_interval"] is False
          assert x["historical_mcmc"]=="NOT_RUN"
          print("R66: role and reporting-cutoff audited, no terminal evidence")
          PY_R66
          python3 -m unittest discover -s tests -p test_c241_omega1_308_crosssource_r65.py -v
          python3 -m unittest discover -s tests -p test_c241_1963_terminal_control_screen.py -v
          python3 -O -m unittest discover -s tests -p test_c241_omega1_308_crosssource_r65.py -v
          python3 -O -m unittest discover -s tests -p test_c241_1963_terminal_control_screen.py -v
          python3 -m unittest discover -s tests -p test_c241_1963_archive_fixed_h_stress.py -v
          python3 -m unittest discover -s tests -p test_c241_decay_day_error_r68.py -v
          python3 -O -m unittest discover -s tests -p test_c241_decay_day_error_r68.py -v
          python3 -O -m unittest discover -s tests -p test_c241_1963_archive_fixed_h_stress.py -v
          python3 -m unittest discover -s tests -p test_c241_308_ssr_calendar_range_r61.py -v
          python3 -O -m unittest discover -s tests -p test_c241_308_ssr_calendar_range_r61.py -v
          python3 -m unittest discover -s tests -p test_c241_terminal_calendar_minimax_r62.py -v
          python3 -O -m unittest discover -s tests -p test_c241_terminal_calendar_minimax_r62.py -v
      - name: Replay pinned secondary archive and negative provenance check
        run: |
          set -euo pipefail
          python3 -m pip install pyarrow==21.0.0
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
            https://huggingface.co/datasets/oxzoid/space-track-tle-history/resolve/4b4fb3a/data/tle_1963.parquet \
            -o "$RUNNER_TEMP/tle_1963.parquet"
          echo 'c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09  '"$RUNNER_TEMP/tle_1963.parquet" | sha256sum -c -
          python3 tools/c241_1963_terminal_control_screen.py --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --output "$RUNNER_TEMP/c241-1963-terminal-controls.json" --check
          python3 tools/c241_1963_archive_fixed_h_stress.py --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --output "$RUNNER_TEMP/c241-1963-fixed-h.json" --check
          python3 tools/c241_king_hele_day_holdout.py --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --output "$RUNNER_TEMP/c241-king-hele-r54.json"
          python3 tools/c241_decay_day_error_r68.py \
            --r54 "$RUNNER_TEMP/c241-king-hele-r54.json" \
            --r60 "$RUNNER_TEMP/c241-1963-fixed-h.json" \
            --json "$RUNNER_TEMP/c241-day-error-r68.json" \
            --tsv "$RUNNER_TEMP/c241-day-error-r68.tsv"
          python3 - "$RUNNER_TEMP/c241-day-error-r68.json" <<'PY_R68'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['schema']=='conde.c241-decay-day-error-unified-r68/v1'
          assert len(x['rows'])==64
          assert sum(bool(r['new_distinct_origin']) for r in x['rows'])==60
          assert {r['norad'] for r in x['rows']}=={637,292,565,308}
          assert all(r['identity_308_conditional'] for r in x['rows'] if r['norad']==308)
          assert x['inference']=={'calibrated_terminal_holdouts':0,
                                  'terminal_time_sigma_hours':None,
                                  'historical_mcmc':'NOT_RUN',
                                  'active_constraint_528':False,
                                  'impact_geography':None}
          print('R68 64 conditional error rows on pinned Parquet; zero calibrated holdouts')
          PY_R68
          python3 tools/c241_308_ssr_calendar_range_r61.py \
            --r60 "$RUNNER_TEMP/c241-1963-fixed-h.json" \
            --ssr research/tle_custody/nasa_ssr_terminal_control_308_C241-L64.json \
            --output "$RUNNER_TEMP/c241-ssr-308-range-r61.json"
          python3 - "$RUNNER_TEMP/c241-ssr-308-range-r61.json" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1], encoding='utf-8'))
          assert x['schema']=='conde.c241-308-ssr-calendar-range-conditional/v1'
          assert x['printed_calendar_days_inclusive']==['1963-10-29','1963-10-30']
          assert set(x['methods'])=={'last_two','median_three'}
          assert all(v['distinct_origins']==4 for v in x['methods'].values())
          assert not x['assumptions']['actual_UTC_interval_known']
          assert x['inference']['calibrated_terminal_holdouts']==0
          assert x['inference']['historical_mcmc']=='NOT_RUN'
          assert x['inference']['active_constraint_528'] is False
          assert x['inference']['sigma_terminal_hours'] is None
          assert x['inference']['impact_probability'] is None
          assert x['methods']['last_two']['ssr_two_day_common_clock_24h']['status']=='NO_COMMON_H_FOR_ANY_SHIFT_IN_STRESS_WINDOW'
          assert x['methods']['last_two']['ssr_two_day_independent_shift_1d']['status']=='INCOMPATIBLE_UNDER_INDEPENDENT_SHIFTS'
          assert x['methods']['median_three']['ssr_two_day_common_clock_24h']['status']=='FEASIBLE_ONLY_IN_ASSUMED_SHIFT_MODEL'
          assert x['methods']['median_three']['ssr_two_day_independent_shift_1d']['status']=='INCONCLUSIVE_UNDER_INDEPENDENT_SHIFTS'
          print('R61: two printed dates, method-split certified; no calibrated terminal holdout')
          PY
          python3 tools/c241_terminal_calendar_minimax_r62.py \
            --r60 "$RUNNER_TEMP/c241-1963-fixed-h.json" \
            --ssr research/tle_custody/nasa_ssr_terminal_control_308_C241-L64.json \
            --output "$RUNNER_TEMP/c241-terminal-minimax-r62.json"
          python3 - "$RUNNER_TEMP/c241-terminal-minimax-r62.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1], encoding='utf-8'))
          assert x['schema']=='conde.c241-terminal-calendar-minimax-conditional/v1'
          assert x['conditional_windows']['nasa_2day_print']['hypothetical_width_hours']==48
          assert x['conditional_windows']['nasa_2day_print']['best_possible_worst_case_point_error_hours_IF_UTC']==24
          assert x['conditional_windows']['secondary_1day_lead']['best_possible_worst_case_point_error_hours_IF_UTC']==12
          assert x['design']['actual_terminal_utc_semantics_known'] is False
          assert x['inference']['historical_mcmc']=='NOT_RUN'
          assert x['inference']['active_constraint_528'] is False
          print('R62: conditional minimax only, no measured sigma or terminal instant')
          PY
          python3 tools/c241_omega1_308_crosssource_r65.py \
            --ssr research/tle_custody/nasa_ssr_omega1_oct15_C241-L68.json \
            --parquet "$RUNNER_TEMP/tle_1963.parquet" --output "$RUNNER_TEMP/c241-r65.json"
          python3 - "$RUNNER_TEMP/c241-r65.json" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['schema']=='conde.c241-omega1-308-numeric-fingerprint-r65/v1'
          c=x['candidate']
          assert (c['raw_rows'],c['unique_epochs'],c['pre_cutoff_epochs'],c['excluded_at_or_after_cutoff'])==(52,52,44,8)
          assert c['last_pre_cutoff_epoch_utc']=='1963-10-14T23:23:55.702464Z'
          assert abs(x['difference_candidate_minus_printed']['period_minutes']+0.064883886)<1e-6
          assert x['inference']['historical_mcmc']=='NOT_RUN'
          assert x['inference']['identity_probability'] is None
          assert x['inference']['terminal_sigma_hours'] is None
          assert x['inference']['active_constraint_528'] is False
          print('R65: numerical fingerprint, zero calibrated observations')
          PY
          python3 tools/c241_omega_print_quantization_r67.py \
            --r65 "$RUNNER_TEMP/c241-r65.json" --output "$RUNNER_TEMP/c241-r67.json"
          python3 - "$RUNNER_TEMP/c241-r67.json" <<'PY_R67'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['schema']=='conde.c241.omega-print-quantization-r67/v1'
          assert set(x['mismatches_under_hypothesis'])=={'period_minutes','apogee_km','perigee_km'}
          assert x['comparisons']['inclination_degrees']['inside_conditional_cell'] is True
          assert x['hypothesis_historically_justified'] is False
          assert x['scientific_interpretation']['orbit_identity_rejected'] is False
          assert x['scientific_interpretation']['historical_mcmc']=='NOT_RUN'
          print('R67: conditional printing cells checked, no orbital identity or sigma inferred')
          PY_R67
          printf 'damaged archive' > "$RUNNER_TEMP/mutant.parquet"
          if python3 tools/c241_omega1_308_crosssource_r65.py \
               --ssr research/tle_custody/nasa_ssr_omega1_oct15_C241-L68.json \
               --parquet "$RUNNER_TEMP/mutant.parquet" --output "$RUNNER_TEMP/should-not-exist-r65.json" \
               2>"$RUNNER_TEMP/r65-negative.log"; then
            echo "FAIL: R65 accepted tampered corpus"
            exit 1
          fi
          grep -q 'pinned secondary archive SHA mismatch' "$RUNNER_TEMP/r65-negative.log"
          test ! -e "$RUNNER_TEMP/should-not-exist-r65.json"

          if python3 tools/c241_1963_terminal_control_screen.py --parquet "$RUNNER_TEMP/mutant.parquet" \
               --output "$RUNNER_TEMP/should-not-exist.json" --check 2>"$RUNNER_TEMP/negative.log"; then
            echo "FAIL: corrupted archive incorrectly passed"
            exit 1
          fi
          grep -q 'SHA-256 mismatch' "$RUNNER_TEMP/negative.log"
          test ! -e "$RUNNER_TEMP/should-not-exist.json"
          python3 - "$RUNNER_TEMP/c241-1963-terminal-controls.json" "$RUNNER_TEMP/c241-1963-fixed-h.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['archive_search_priority_norad']==[292,308,565,668]
          assert {r['norad']:r['catalogue_unique_epochs'] for r in x['cases']}=={
             292:53,308:52,565:31,668:10,637:25,688:1,528:45}
          assert all(not r['terminal_holdout_ready'] for r in x['cases'])
          assert all(not r['terminal_time_error_calibrated'] for r in x['cases'])
          assert x['inference']['historical_mcmc']=='NOT_RUN'
          assert x['inference']['active_constraint_528'] is False
          assert x['inference']['impact_probability'] is None
          y=json.load(open(sys.argv[2],encoding='utf-8'))
          assert set(y['cases'])=={'292','308','565','668'}
          for sid in ('292','308','565','668'):
            assert y['cases'][sid]['methods']['last_two']['common_clock_24h']['status']=='NO_COMMON_H_FOR_ANY_SHIFT_IN_STRESS_WINDOW'
          for sid in ('292','308','565'):
            assert y['cases'][sid]['methods']['median_three']['common_clock_24h']['status']=='NO_COMMON_H_FOR_ANY_SHIFT_IN_STRESS_WINDOW'
          assert y['cases']['668']['methods']['median_three']['common_clock_24h']['status']=='NOT_ESTIMABLE_ALL_CUTOFFS'
          assert y['cases']['565']['methods']['last_two']['duplicate_cutoffs_coalesced']==1
          assert y['inference']['calibrated_terminal_holdouts']==0
          assert y['inference']['historical_mcmc']=='NOT_RUN'
          assert y['inference']['active_constraint_528'] is False
          assert y['inference']['impact_probability'] is None
          print('7 objects; 4 archival leads; 0 calibrated terminal holdouts; negative PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c241-terminal-control-screen-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c241-1963-terminal-controls.json
            ${{ runner.temp }}/c241-1963-fixed-h.json
            ${{ runner.temp }}/c241-king-hele-r54.json
            ${{ runner.temp }}/c241-day-error-r68.json
            ${{ runner.temp }}/c241-day-error-r68.tsv
            ${{ runner.temp }}/c241-ssr-308-range-r61.json
            ${{ runner.temp }}/c241-terminal-minimax-r62.json
          if-no-files-found: error
          retention-days: 30
