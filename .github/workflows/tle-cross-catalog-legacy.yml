name: Tartaruga - C241-L8 six-field cross-catalog audit
on:
  pull_request:
    paths:
      - tools/tle_cross_catalog_legacy_audit.py
      - tests/test_tle_cross_catalog_legacy_audit.py
      - research/tle_custody/evidence_matrix_C241-L8_2026-11-12.md
      - .github/workflows/tle-cross-catalog-legacy.yml
  push:
    branches: [main]
    paths:
      - tools/tle_cross_catalog_legacy_audit.py
      - tests/test_tle_cross_catalog_legacy_audit.py
      - research/tle_custody/evidence_matrix_C241-L8_2026-11-12.md
      - .github/workflows/tle-cross-catalog-legacy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-catalog-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source HEAD
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "audited_source_head=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial controls and existing regression
        run: |
          python -m unittest discover -s tests -p 'test_tle_cross_catalog_legacy_audit.py' -v
          python -m unittest discover -s tests -p 'test_tle_mean_motion_secant_audit.py' -v
          python -m unittest discover -s tests -p 'test_tle_literal_layout.py' -v
      - name: Pin Parquet decoder
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Verify 1963 secondary SHA and generate indexed CSV
        run: |
          python tools/tle_secondary_1963_ledger.py --download --parquet "$RUNNER_TEMP/tle_1963.parquet" --literal research/tle_custody/mirror_528_1963-10-27.tle --output "$RUNNER_TEMP/c241-l8"
      - name: Compare all six orbital fields within each epoch
        run: |
          python tools/tle_cross_catalog_legacy_audit.py --csv "$RUNNER_TEMP/c241-l8/norad_527_528_529_numeric_1963.csv" --output "$RUNNER_TEMP/c241-l8/cross_catalog_c241_l8.json"
      - name: Fail closed on source, corpus, uncertainty and scientific result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"c241-l8/cross_catalog_c241_l8.json").read_text())
          c=r["comparison"]
          assert r["evidence_id"] == "C241-L8"
          assert r["provenance"]["secondary_parquet_sha256"] == "c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09"
          assert r["provenance"]["derived_csv_sha256"] == r["provenance"]["pinned_csv_sha256"] == "3940715d7c15cf15c24e678a8c5b5fbb34a031b3ffd7e33c0580277377383231"
          assert r["provenance"]["legacy_tle_git_blob_sha1"] == "0284f1217557b0ea891b5e51b6ac56bd13529d3f"
          assert c["records_scanned"] == 123 and c["distinct_catalog_epochs_scanned"] == 119
          assert {s:(v["rows"],v["distinct_epochs"]) for s,v in c["by_catalog"].items()} == {"527":(21,20),"528":(45,45),"529":(57,54)}
          assert c["all_six_any_epoch_all_catalogs"] == c["all_six_any_epoch_527_or_529"] == 0
          assert c["full_legacy_vector_any_catalog_hypothesis"] == "NO_SIX_FIELD_MATCH_IN_PINNED_MIRROR"
          assert all(v["closest_raan_same_record"] for v in c["by_catalog"].values())
          assert r["constraint_link"]["measurement_sigma"] is None
          assert r["constraint_link"]["reference_frame_historical"] is None
          assert r["constraint_link"]["state"] == "CONNECTED_PENDING_CALIBRATION"
          assert r["constraint_link"]["candidate_Lean_4_35_0_predicate"] == "NOT_PROMOTED"
          assert r["constraint_link"]["physical_parameter_domain_reduced"] is False
          assert r["conde_impact"] == "INDETERMINATE"
          print("C241-L8: no full legacy vector match in 119 secondary distinct epochs")
          PY
      - name: Archive exact-corpus ledger and negative fingerprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l8-cross-catalog-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l8/
          if-no-files-found: warn
          retention-days: 30
