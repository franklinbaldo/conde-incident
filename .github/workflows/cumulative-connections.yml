name: Cumulative scientific connections
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  connected-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate cumulative graph and non-activation guards
        run: python3 -m unittest discover -s tests -p "test_cumulative_constraints.py" -v
      - name: Generate connected observable handoff
        run: python3 formal/scripts/check_cumulative_connections.py --output /tmp/conde-connected-handoff.json
      - uses: actions/upload-artifact@v4
        with:
          name: cumulative-constraints
          path: /tmp/conde-connected-handoff.json
