name: Tartaruga - NASA NTRS 1963 SSR index custody
on:
  pull_request:
    paths:
      - tools/tle_ntrs_ssr_index_audit.py
      - tools/tle_ntrs_crossquery_c241_l42.py
      - tests/test_tle_ntrs_ssr_index_audit.py
      - tests/test_tle_ntrs_crossquery_c241_l42.py
      - research/tle_custody/ntrs_ssr_1963_index_C241-L25.json
      - research/tle_custody/ntrs_ssr_crossquery_C241-L42.json
      - research/tle_custody/evidence_matrix_C241-L25_2026-11-13.md
      - research/tle_custody/sao_archival_tracking_leads_C241-L43.json
      - research/tle_custody/evidence_matrix_C241-L43_2026-11-13.md
      - tools/tle_sao_archive_leads_c241_l43.py
      - tests/test_tle_sao_archive_leads_c241_l43.py
      - .github/workflows/tle-ntrs-ssr-index.yml
  push:
    branches: [main]
    paths:
      - tools/tle_ntrs_ssr_index_audit.py
      - tools/tle_ntrs_crossquery_c241_l42.py
      - tests/test_tle_ntrs_ssr_index_audit.py
      - tests/test_tle_ntrs_crossquery_c241_l42.py
      - research/tle_custody/ntrs_ssr_1963_index_C241-L25.json
      - research/tle_custody/ntrs_ssr_crossquery_C241-L42.json
      - research/tle_custody/evidence_matrix_C241-L25_2026-11-13.md
      - research/tle_custody/sao_archival_tracking_leads_C241-L43.json
      - research/tle_custody/evidence_matrix_C241-L43_2026-11-13.md
      - tools/tle_sao_archive_leads_c241_l43.py
      - tests/test_tle_sao_archive_leads_c241_l43.py
      - .github/workflows/tle-ntrs-ssr-index.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ntrs-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test source projections on exact SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p test_tle_ntrs_ssr_index_audit.py -v
          python3 -m unittest discover -s tests -p test_tle_ntrs_crossquery_c241_l42.py -v
          python3 -m unittest discover -s tests -p test_tle_sao_archive_leads_c241_l43.py -v
          python3 tools/tle_ntrs_crossquery_c241_l42.py > "$RUNNER_TEMP/ntrs-l42-offline.json"
          python3 tools/tle_ntrs_ssr_index_audit.py --output "$RUNNER_TEMP/ntrs-1963-offline.json"
      - name: Query current NASA NTRS metadata and compare source anchors
        run: |
          python3 tools/tle_ntrs_ssr_index_audit.py --live --output "$RUNNER_TEMP/ntrs-1963-live.json"
          python3 tools/tle_sao_archive_leads_c241_l43.py --live > "$RUNNER_TEMP/sao-l43-live.json"
          python3 tools/tle_ntrs_crossquery_c241_l42.py --live > "$RUNNER_TEMP/ntrs-l42-live.json"
          python3 - "$RUNNER_TEMP/ntrs-1963-live.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert len(result["known_source_ids"]) == 11
          assert result["index_search_does_not_prove_absence"] is True
          assert result["instrumental_observations"] == 0
          assert result["physical_constraints_activated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c241-l25-ntrs-index-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ntrs-1963-offline.json
            ${{ runner.temp }}/ntrs-1963-live.json
            ${{ runner.temp }}/ntrs-l42-offline.json
            ${{ runner.temp }}/ntrs-l42-live.json
            ${{ runner.temp }}/sao-l43-live.json
          if-no-files-found: warn
          retention-days: 30

