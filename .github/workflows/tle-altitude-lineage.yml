name: Tartaruga - C241-L9 altitude field dependence

on:
  pull_request:
    paths:
      - tools/tle_altitude_lineage_audit.py
      - tests/test_tle_altitude_lineage_audit.py
      - research/tle_custody/evidence_matrix_C241-L9_2026-11-12.md
      - .github/workflows/tle-altitude-lineage.yml
  push:
    branches: [main]
    paths:
      - tools/tle_altitude_lineage_audit.py
      - tests/test_tle_altitude_lineage_audit.py
      - research/tle_custody/evidence_matrix_C241-L9_2026-11-12.md
      - .github/workflows/tle-altitude-lineage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  altitude-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source HEAD
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "audited_source_head=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 14 adversarial controls and secondary ledger regressions
        run: |
          python -m unittest discover -s tests -p 'test_tle_altitude_lineage_audit.py' -v
          python -m unittest discover -s tests -p 'test_tle_mean_motion_secant_audit.py' -v
          python -m unittest discover -s tests -p 'test_tle_secondary_1963_ledger.py' -v
      - name: Pin Parquet decoder
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: SHA-verify source and reconstruct only derived records
        run: |
          python tools/tle_secondary_1963_ledger.py --download \
            --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --literal research/tle_custody/mirror_528_1963-10-27.tle \
            --output "$RUNNER_TEMP/c241-l9"
          python tools/tle_altitude_lineage_audit.py \
            --csv "$RUNNER_TEMP/c241-l9/norad_527_528_529_numeric_1963.csv" \
            --output "$RUNNER_TEMP/c241-l9/altitude_c241_l9.json"
      - name: Fail closed on count, candidate and independence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'c241-l9/altitude_c241_l9.json').read_text())
          assert r['evidence_id'] == 'C241-L9'
          assert (r['source_rows_total'], r['distinct_catalog_epochs']) == (123, 119)
          assert [(r['by_norad'][x]['original_rows'], r['by_norad'][x]['distinct_epochs']) for x in ('527', '528', '529')] == [(21,20),(45,45),(57,54)]
          assert r['overall']['perigee_6371_numerical_match_at_0_1km_not_ETL_proof'] == 119
          assert r['overall']['perigee_implied_radius_spread_km'] < 0.01
          assert abs(r['overall']['proxy_comparisons']['perigee_using_mean_earth_radius_6371']['mean_absolute_residual_km'] - 0.002422669) < 0.00000001
          assert r['source']['ETL_formula_for_altitude_km'] == 'NOT_VERIFIED'
          assert r['source']['independent_altitude_measurement'] == 'NOT_ESTABLISHED'
          assert r['constraint_link']['state'] == 'CONNECTED_PENDING_CALIBRATION'
          assert r['constraint_link']['sensor_error_sigma_km'] is None
          assert r['constraint_link']['physical_frame'] is None
          assert r['constraint_link']['lean_4_35_0_physical_predicate'] == 'NOT_PROMOTED'
          assert r['lean_4_35_physical_restriction'] == 'NOT_PROMOTED'
          assert r['calibrated_simulation_holdout'] == 'NOT_RUN'
          assert r['conde_impact'] == 'INDETERMINATE'
          print('C241-L9 pinned numerical dependency only: PASS')
          PY
      - name: Archive exact-head reports and indexed CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l9-altitude-dependence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l9/
          if-no-files-found: warn
          retention-days: 30
