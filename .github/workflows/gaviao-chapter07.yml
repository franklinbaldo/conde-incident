name: Gaviao chapter07 source and logic audit
on:
  pull_request:
    paths:
      - 'research/gaviao_chapter07_*'
      - 'tools/gaviao_chapter07_audit.py'
      - 'tests/test_gaviao_chapter07.py'
      - 'team/memory/gaviao/**'
      - '.github/workflows/gaviao-chapter07.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact checkout SHA
        env:
          SHA_EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA_EXPECTED"
          echo "GAVIAO_CH07_HEAD=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial tests on documented defect
        run: python -m unittest discover -s tests -p 'test_gaviao_chapter07.py' -v
      - name: Re-check immutable article SHA and explicit provenance limits
        run: python tools/gaviao_chapter07_audit.py --download
