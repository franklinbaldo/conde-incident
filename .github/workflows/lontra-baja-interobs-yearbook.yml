name: Lontra Baja 1965 yearbook archival provenance
on:
  pull_request:
    paths:
      - 'research/tle_custody/*LONTRA-R39*'
      - 'research/tle_custody/baja_1966_yearbook_interobs_C241-LONTRA-R39.json'
      - 'tools/verify_baja_interobs_yearbook.py'
      - 'tests/test_baja_interobs_yearbook.py'
      - '.github/workflows/lontra-baja-interobs-yearbook.yml'
  push:
    branches: [main]
    paths:
      - 'research/tle_custody/*LONTRA-R39*'
      - 'research/tle_custody/baja_1966_yearbook_interobs_C241-LONTRA-R39.json'
      - 'tools/verify_baja_interobs_yearbook.py'
      - 'tests/test_baja_interobs_yearbook.py'
      - '.github/workflows/lontra-baja-interobs-yearbook.yml'
  workflow_dispatch:
jobs:
  custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact audited head
        run: |
          test "$(git rev-parse HEAD)" = "\${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Test source claims in normal and optimized Python
        run: |
          python3 -m unittest discover -s tests -p 'test_baja_interobs_yearbook.py' -v
          python3 -O -m unittest discover -s tests -p 'test_baja_interobs_yearbook.py' -v
      - name: Replay original full PDF from the institutional repository
        run: |
          python3 -m pip install 'pypdf==6.4.0'
          curl --fail --show-error --silent --location --retry 2 --max-time 120 \
            'https://real-j.mtak.hu/15014/1/csillagaszati_evkonyv_1966.pdf' -o /tmp/baja-yearbook-1966.pdf
          python3 tools/verify_baja_interobs_yearbook.py --pdf-original /tmp/baja-yearbook-1966.pdf
          python3 -O tools/verify_baja_interobs_yearbook.py --pdf-original /tmp/baja-yearbook-1966.pdf
