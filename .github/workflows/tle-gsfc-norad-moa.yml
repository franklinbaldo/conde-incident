name: Tartaruga - C241-L24 GSFC NORAD custody
on:
  pull_request:
    paths:
      - tools/tle_gsfc_norad_moa_audit.py
      - tests/test_tle_gsfc_norad_moa_audit.py
      - research/tle_custody/gsfc_norad_moa_1962_C241-L24.json
      - research/tle_custody/evidence_matrix_C241-L24_2026-11-13.md
      - .github/workflows/tle-gsfc-norad-moa.yml
  push:
    branches: [main]
    paths:
      - tools/tle_gsfc_norad_moa_audit.py
      - tests/test_tle_gsfc_norad_moa_audit.py
      - research/tle_custody/gsfc_norad_moa_1962_C241-L24.json
      - research/tle_custody/evidence_matrix_C241-L24_2026-11-13.md
      - .github/workflows/tle-gsfc-norad-moa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run adversarial source controls
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p test_tle_gsfc_norad_moa_audit.py -v
      - name: Verify original House facsimile bytes
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            'https://www.govinfo.gov/content/pkg/SERIALSET-12667_05_00-002-0197-0000/pdf/SERIALSET-12667_05_00-002-0197-0000.pdf' \
            -o "$RUNNER_TEMP/house-89-197.pdf"
          python3 tools/tle_gsfc_norad_moa_audit.py --pdf "$RUNNER_TEMP/house-89-197.pdf" --output "$RUNNER_TEMP/c241-l24.json"
          python3 - "$RUNNER_TEMP/c241-l24.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result["pdf_replayed"]
          assert result["channels_connected"]==5
          assert result["new_instrumental_observations"]==0
          assert result["physical_constraints_activated"]==0
          PY
