name: Tartaruga - C241-L14 full GCAT cross-catalog custody
on:
  pull_request:
    paths:
      - tools/tle_gcat_cross_catalog_audit.py
      - tests/test_tle_gcat_cross_catalog_audit.py
      - research/tle_custody/gcat_full_catalog_lineage_C241-L14.json
      - research/tle_custody/evidence_matrix_C241-L14_2026-11-12.md
      - .github/workflows/tle-gcat-cross-catalog.yml
  push:
    branches: [main]
    paths:
      - tools/tle_gcat_cross_catalog_audit.py
      - tests/test_tle_gcat_cross_catalog_audit.py
      - research/tle_custody/gcat_full_catalog_lineage_C241-L14.json
      - research/tle_custody/evidence_matrix_C241-L14_2026-11-12.md
      - .github/workflows/tle-gcat-cross-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gcat-catalogues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD and synthetic adversarial controls
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p 'test_tle_gcat_cross_catalog_audit.py' -v
      - name: Capture mutable GCAT source bytes and verify records
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            https://planet4589.org/space/gcat/data/derived/currentcat.html -o "$RUNNER_TEMP/currentcat.html"
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            https://planet4589.org/space/gcat/data/cat/satcat.html -o "$RUNNER_TEMP/satcat.html"
          sha256sum "$RUNNER_TEMP/currentcat.html" "$RUNNER_TEMP/satcat.html"
          python3 tools/tle_gcat_cross_catalog_audit.py \
            --currentcat "$RUNNER_TEMP/currentcat.html" --satcat "$RUNNER_TEMP/satcat.html" \
            --output "$RUNNER_TEMP/c241-l14.json"
          python3 - "$RUNNER_TEMP/c241-l14.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["catalogue_name_mismatch"] and d["conde_outcome"]=="INDETERMINATE"
          assert d["instrument_sigma"] is None
          assert len(d["source_capture"])==2
          PY
      - name: Archive literal rows, bytes hashes and negative fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l14-gcat-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l14.json
          if-no-files-found: warn
          retention-days: 30
