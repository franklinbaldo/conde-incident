name: TLE NORAD Jan-Jun 1963 Cold Lake C241-L57
on:
  pull_request:
    paths:
      - 'research/tle_custody/*C241-L57*'
      - 'tools/tle_norad_janjun_cold_lake_c241_l57.py'
      - 'tests/test_tle_norad_janjun_cold_lake_c241_l57.py'
      - '.github/workflows/tle-norad-jan-jun-1963.yml'
  push:
    branches: [main]
    paths:
      - 'research/tle_custody/*C241-L57*'
      - 'tools/tle_norad_janjun_cold_lake_c241_l57.py'
      - 'tests/test_tle_norad_janjun_cold_lake_c241_l57.py'
      - '.github/workflows/tle-norad-jan-jun-1963.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact triggering HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.1.3
      - name: Ordinary and optimized negative tests
        run: |
          python -m unittest discover -s tests -p test_tle_norad_janjun_cold_lake_c241_l57.py -v
          python -O -m unittest discover -s tests -p test_tle_norad_janjun_cold_lake_c241_l57.py -v
      - name: Replay original 1963 NORAD PDF by bytes, SHA and pagination
        run: python tools/tle_norad_janjun_cold_lake_c241_l57.py --live
