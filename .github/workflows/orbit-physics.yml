name: Coupled orbit physics
on:
  pull_request:
  push:
    branches: [main]

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checks must run on the exact proposed head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physical conservation, synthetic inverse, seeded ensemble
        run: node --experimental-strip-types --test tests/orbitPhysics.test.mjs
