name: C241 mass budget 527 528 529 and residual X
on:
  pull_request:
    paths:
      - research/constraints/C241_mass_budget_residual_2026-11-13.json
      - research/tle_custody/evidence_matrix_C241-mass-budget-X_2026-11-13.md
      - tools/mass_budget_527_529.py
      - tests/test_mass_budget_527_529.py
      - formal/Conde1963/MassBudget527529.lean
      - formal/Conde1963.lean
      - .github/workflows/mass-budget-527-529.yml
  push:
    branches: [main]
    paths:
      - research/constraints/C241_mass_budget_residual_2026-11-13.json
      - research/tle_custody/evidence_matrix_C241-mass-budget-X_2026-11-13.md
      - tools/mass_budget_527_529.py
      - tests/test_mass_budget_527_529.py
      - formal/Conde1963/MassBudget527529.lean
      - formal/Conde1963.lean
      - .github/workflows/mass-budget-527-529.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Source-linked mass budget and adversarial tests
        run: |
          python3 -m unittest discover -s tests -p test_mass_budget_527_529.py -v
          python3 tools/mass_budget_527_529.py --output "$RUNNER_TEMP/mass_budget_default.json"
          python3 tools/mass_budget_527_529.py --error-max-kg 26 --untracked-max-kg 50 --output "$RUNNER_TEMP/mass_budget_example.json"
          python3 - "$RUNNER_TEMP/mass_budget_default.json" "$RUNNER_TEMP/mass_budget_example.json" <<'PY'
          import json,sys
          default,example=(json.load(open(p)) for p in sys.argv[1:])
          assert default['scenario']['tracked_mass_sum_max_kg'] is None
          assert not default['historical_domain_reduction']
          assert example['scenario']['tracked_mass_sum_min_infimum_kg']=='1100'
          assert example['scenario']['tracked_mass_sum_max_kg']=='1202'
          assert not example['scenario']['physical_constraint_active']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-budget-C241-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mass_budget_*.json
          if-no-files-found: warn
          retention-days: 30
