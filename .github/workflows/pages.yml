name: Publish Conde site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conde-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Verify laboratory URL fragments
        run: node --experimental-strip-types --test tests/labRoutes.test.mjs
      - name: Build React scientific lab under repository subpath
        run: SCIENCE_BASE=/conde-incident/lab/ bun run build
      - name: Embed laboratory in Zola static output
        run: mkdir -p static/lab && cp -R dist/. static/lab/
      - name: Generate native Zola pages from canonical Markdown
        run: node scripts/prepare-zola.mjs
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
          fallback: none
      - name: Check Zola templates and internal links
        run: zola check --skip-external-links
      - name: Build editorial site
        run: zola build
      - name: Verify chapter rendering and /conde-incident/ paths
        run: node scripts/check-site.mjs
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
