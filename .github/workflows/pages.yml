name: Publish Conde site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: conde-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Audit casefile UX architecture and no-JS prototype
        run: node --test tests/ux-casefile-prototype.test.mjs
      - name: Build scientific lab at nested Pages path
        run: VITE_BASE_PATH=/conde-incident/lab/ bun run build
      - name: Verify lazy instrument chunks and lab entry payload (UX-08)
        run: node --test tests/lab-code-split.test.mjs
      - name: Install verified SSG Rust 0.0.75 binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/sebastienrousseau/static-site-generator/releases/download/v0.0.75/ssg-v0.0.75-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$RUNNER_TEMP/ssg-0.0.75.tar.gz"
          printf '%s  %s\n' 'f6305109e9bec5895e9c90f97a5c569c74048b3d50823d40175e15ca99c50843' "$RUNNER_TEMP/ssg-0.0.75.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ssg-0.0.75.tar.gz" -C "$RUNNER_TEMP" ssg
          chmod 755 "$RUNNER_TEMP/ssg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Record real CLI
        run: |
          ssg --version
          ssg --help
          ssg build --help
      - name: Exercise documentary archive and Wayback custody adversarial tests
        run: node --test tests/ssg-documentary-archive.test.mjs tests/ssg-wayback-custody.test.mjs tests/ssg-matrix-catalog.test.mjs
      - name: Verify quota-free local geography from pinned Natural Earth
        run: python3 scripts/build-conde-context-map.py --check
      - name: Test SSG local TLE syntax audit with adversarial bytes
        run: node --test tests/ssg-tle-syntax.test.mjs
      - name: Test verified reverse-source index UI and static fallback
        run: node --test tests/ssg-source-lookup-ui.test.mjs
      - name: Test no-JS map on the independent SSG page
        run: node --test tests/ssg-map-context.test.mjs
      - name: Validate chapter schema and chronology
        run: node scripts/prepare-ssg.mjs --check
      - name: Generate SSG inputs from canonical stories
        run: node scripts/prepare-ssg.mjs
      - name: Validate generated OKF types
        run: node scripts/check-ssg-okf.mjs
      - name: Verify reproducible, bounded documentary JSON index
        run: |
          python3 -m unittest discover -s tests -p test_ssg_evidence_*.py
          python3 tools/export_ssg_evidence_index.py --check
          node --test tests/ssg-evidence-index-bridge.test.mjs tests/ssg-evidence-lookup.test.mjs
          node scripts/verify-ssg-evidence-index.mjs
      - name: Snapshot versioned scientific JSON before SSG rebuild
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/conde-source-data"
          cp -a public/data/. "$RUNNER_TEMP/conde-source-data/"
          test -f "$RUNNER_TEMP/conde-source-data/conde-source-citations.json"
      - name: SSG check
        run: ssg check --config ssg.toml
      - name: SSG build
        run: ssg build --config ssg.toml
      - name: Restore published JSON and verify custody after SSG rebuild
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          cp -a "$RUNNER_TEMP/conde-source-data/." public/data/
          diff -qr "$RUNNER_TEMP/conde-source-data" public/data
      - name: Allow documentary frames in generated article CSP
        run: node scripts/enable-article-frames.mjs
      - name: Unite Vite lab and styles with SSG output
        run: |
          mkdir -p public/lab public/css public/img public/js
          cp -R dist/. public/lab/
          cp -R static/css/. public/css/
          cp -R static/img/. public/img/
          cp -R static/js/. public/js/
      - name: Build and verify no-JS SSG deep-page breadcrumbs
        run: |
          node --test tests/ssg-breadcrumbs.test.mjs
          node scripts/ssg-breadcrumbs.mjs public
          node scripts/ssg-breadcrumbs.mjs public --check
      - name: Verify published SSG documentary status deep links
        run: node --test tests/ssg-state-fragments-built.check.mjs
      - name: Check reversible report-to-document journeys in built HTML
        run: node --test tests/ssg-story-journey-built.check.mjs
      - name: Test and build canonical sitemap from final Pages artifact
        run: |
          node --test tests/ssg-sitemap.test.mjs
          node scripts/build-sitemap.mjs public
          python3 tools/check_sitemap.py public
      - name: Audit actual GitHub Pages prefix without weakening gates
        run: |
          mkdir -p "$RUNNER_TEMP/conde-audit-root/conde-incident"
          cp -R public/. "$RUNNER_TEMP/conde-audit-root/conde-incident/"
          ssg audit --output "$RUNNER_TEMP/conde-audit-root" --config ssg.toml --fail-on error
      - name: Verify every JSON deep link against real built SSG HTML
        run: node scripts/verify-ssg-evidence-index.mjs --built-site
      - name: Verify matrix catalog against real SSG HTML and links
        run: node scripts/ssg-matrix-catalog.mjs --built-site
      - name: Verify every article and /conde-incident/ paths
        run: node scripts/check-site.mjs
      - name: Verify centered SSG footer in built Pages HTML
        run: node --test scripts/check-ssg-footer.mjs
      - name: Verify independent authored Page URLs
        run: node scripts/check-ssg-authored-site.mjs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
