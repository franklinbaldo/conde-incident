name: Publish Conde site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: conde-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Build scientific lab at nested Pages path
        run: VITE_BASE_PATH=/conde-incident/lab/ bun run build
      - name: Install verified SSG Rust 0.0.75 binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/sebastienrousseau/static-site-generator/releases/download/v0.0.75/ssg-v0.0.75-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$RUNNER_TEMP/ssg-0.0.75.tar.gz"
          printf '%s  %s\n' 'f6305109e9bec5895e9c90f97a5c569c74048b3d50823d40175e15ca99c50843' "$RUNNER_TEMP/ssg-0.0.75.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ssg-0.0.75.tar.gz" -C "$RUNNER_TEMP" ssg
          chmod 755 "$RUNNER_TEMP/ssg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Record real CLI
        run: |
          ssg --version
          ssg --help
          ssg build --help
      - name: Validate chapter schema and chronology
        run: node scripts/prepare-ssg.mjs --check
      - name: Generate SSG inputs from canonical stories
        run: node scripts/prepare-ssg.mjs
      - name: Validate generated OKF types
        run: node scripts/check-ssg-okf.mjs
      - name: SSG check
        run: ssg check --config ssg.toml
      - name: SSG build
        run: ssg build --config ssg.toml
      - name: Allow documentary frames in generated article CSP
        run: node scripts/enable-article-frames.mjs
      - name: Unite Vite lab and styles with SSG output
        run: |
          mkdir -p public/lab public/css public/img
          cp -R dist/. public/lab/
          cp -R static/css/. public/css/
          cp -R static/img/. public/img/
      - name: Audit actual GitHub Pages prefix without weakening gates
        run: |
          mkdir -p "$RUNNER_TEMP/conde-audit-root/conde-incident"
          cp -R public/. "$RUNNER_TEMP/conde-audit-root/conde-incident/"
          ssg audit --output "$RUNNER_TEMP/conde-audit-root" --config ssg.toml --fail-on error
      - name: Verify every article and /conde-incident/ paths
        run: node scripts/check-site.mjs
      - name: Verify independent authored Page URLs
        run: node scripts/check-ssg-authored-site.mjs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
