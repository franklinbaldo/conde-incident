name: Publish Conde site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: conde-site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Build scientific lab at nested Pages path
        run: VITE_BASE_PATH=/conde-incident/lab/ bun run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exact SSG Rust release
        run: cargo install ssg --version 0.0.75 --locked
      - name: Record real CLI
        run: |
          ssg --version
          ssg --help
          ssg build --help
      - name: Validate chapter schema and chronology
        run: node scripts/prepare-ssg.mjs --check
      - name: Generate SSG inputs from canonical stories
        run: node scripts/prepare-ssg.mjs
      - name: SSG check
        run: ssg check --config ssg.toml
      - name: SSG build
        run: ssg build --config ssg.toml
      - name: Unite Vite lab and styles with SSG output
        run: |
          mkdir -p public/lab public/css
          cp -R dist/. public/lab/
          cp -R static/css/. public/css/
      - name: SSG audit
        run: ssg audit public --out text
      - name: Verify every article and /conde-incident/ paths
        run: node scripts/check-site.mjs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
