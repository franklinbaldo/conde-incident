name: Integration checks (exact head)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head SHA
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          printf 'Tested source commit: %s\n' "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Install exact locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Build Vite frontend
        run: bun run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute all Python unittest suites (fail closed)
        shell: bash
        run: |
          # Do not report a green gate when test discovery finds no files.
          test -n "$(find tests -type f -name 'test_*.py' -print -quit)"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Execute present Node regression suites
        shell: bash
        run: |
          shopt -s nullglob globstar
          tests=(scripts/**/*.test.mjs tests/**/*.test.mjs)
          if (( ${#tests[@]} )); then
            node --test "${tests[@]}"
          else
            echo "NO_NODE_TEST_FILES: scripts/ and tests/ have no *.test.mjs at checked-out head"
          fi

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head SHA
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Detect Lean package
        id: detect
        shell: bash
        run: |
          if [[ -f formal/lean-toolchain && ( -f formal/lakefile.toml || -f formal/lakefile.lean ) ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ -d formal ]]; then
            echo "::error::formal/ exists but its Lean toolchain or Lake manifest is missing"
            exit 1
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "NO_LEAN_PACKAGE: no formal/ directory in this commit"
          fi
      - name: Install pinned Lean via elan
        if: steps.detect.outputs.available == 'true'
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile conditional proofs
        if: steps.detect.outputs.available == 'true'
        working-directory: formal
        run: lake build
