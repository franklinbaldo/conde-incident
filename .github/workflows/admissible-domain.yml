name: Admissible domain contract
on:
  pull_request:
    paths:
      - 'scripts/audit-admissible-domain.mjs'
      - 'tests/admissible-domain.test.mjs'
      - 'research/ADMISSIBLE_DOMAIN_GATE.md'
      - '.github/workflows/admissible-domain.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-admissible-domain.mjs'
      - 'tests/admissible-domain.test.mjs'
      - 'research/ADMISSIBLE_DOMAIN_GATE.md'
      - '.github/workflows/admissible-domain.yml'
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/admissible-domain.test.mjs
