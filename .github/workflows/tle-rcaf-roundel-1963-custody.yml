name: TLE RCAF Roundel 1963 custody C241-L55
on:
  pull_request:
    paths:
      - 'research/tle_custody/rcaf_roundel_spadats_1963_C241-L55.json'
      - 'tools/tle_rcaf_roundel_spadats_c241_l55.py'
      - 'tests/test_tle_rcaf_roundel_spadats_c241_l55.py'
      - '.github/workflows/tle-rcaf-roundel-1963-custody.yml'
  push:
    branches: [main]
    paths:
      - 'research/tle_custody/rcaf_roundel_spadats_1963_C241-L55.json'
      - 'tools/tle_rcaf_roundel_spadats_c241_l55.py'
      - 'tests/test_tle_rcaf_roundel_spadats_c241_l55.py'
      - '.github/workflows/tle-rcaf-roundel-1963-custody.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact event HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.1.3
      - name: Adversarial audit in ordinary and optimized modes
        run: |
          python -m unittest discover -s tests -p test_tle_rcaf_roundel_spadats_c241_l55.py -v
          python -O -m unittest discover -s tests -p test_tle_rcaf_roundel_spadats_c241_l55.py -v
      - name: Independently download the complete Roundel PDF and verify original text
        run: python tools/tle_rcaf_roundel_spadats_c241_l55.py --live
