name: Tartaruga - C241-L10 NORAD COSPAR identity lineage

on:
  pull_request:
    paths:
      - tools/tle_identity_lineage_audit.py
      - tests/test_tle_identity_lineage_audit.py
      - research/tle_custody/catalog_identity_527_529_2026-11-12.json
      - research/tle_custody/evidence_matrix_C241-L10_2026-11-12.md
      - .github/workflows/tle-identity-lineage.yml
  push:
    branches: [main]
    paths:
      - tools/tle_identity_lineage_audit.py
      - tests/test_tle_identity_lineage_audit.py
      - research/tle_custody/catalog_identity_527_529_2026-11-12.json
      - research/tle_custody/evidence_matrix_C241-L10_2026-11-12.md
      - .github/workflows/tle-identity-lineage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "audited_source_head=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adversarial identity controls plus literal and ledger regressions
        run: |
          python -m unittest discover -s tests -p 'test_tle_identity_lineage_audit.py' -v
          python -m unittest discover -s tests -p 'test_tle_literal_layout.py' -v
          python -m unittest discover -s tests -p 'test_tle_secondary_1963_ledger.py' -v
      - name: Pin Parquet decoder
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Verify source hashes and construct deterministic indexed report
        run: |
          python tools/tle_secondary_1963_ledger.py --download             --parquet "$RUNNER_TEMP/tle_1963.parquet"             --literal research/tle_custody/mirror_528_1963-10-27.tle             --output "$RUNNER_TEMP/c241-l10"
          python tools/tle_identity_lineage_audit.py             --csv "$RUNNER_TEMP/c241-l10/norad_527_528_529_numeric_1963.csv"             --ledger research/tle_custody/catalog_identity_527_529_2026-11-12.json             --pair research/tle_custody/mirror_528_1963-10-27.tle             --output "$RUNNER_TEMP/c241-l10/identity_c241_l10.json"
      - name: Fail closed on catalog join, NASA date precision and missing physics
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'c241-l10/identity_c241_l10.json'
          r = json.loads(p.read_text())
          assert r['record_id'] == 'C241-L10'
          assert r['classification'] == 'CATALOG_IDENTITY_CONSISTENCY_NOT_ENGINEERING_IDENTITY'
          assert [(r['catalog_join'][x]['rows'], r['catalog_join'][x]['unique_epochs']) for x in ('527','528','529')] == [(21,20),(45,45),(57,54)]
          assert {x:r['catalog_join'][x]['cospar'] for x in ('527','528','529')} == {'527':'1963-003A','528':'1963-003B','529':'1963-003C'}
          assert r['literal_528_cospar'] == '1963-003B'
          assert r['source']['nasa_date_only']['decay_day'] == '1963-11-08'
          assert r['source']['nasa_date_only']['catalog_designator_printed'] == '1963 3B'
          assert r['source']['nasa_date_only']['extraction_status'] == 'VISUALLY_REINSPECTED_PDF_PAGE_9_PRINTED_8_2026-11-12'
          assert r['physical_component_identity_528'] == 'NOT_RECOVERED'
          assert r['constraint_graph']['state'] == 'CONNECTED_PENDING_CALIBRATION'
          assert r['constraint_graph']['independence'] == 'NOT_ESTABLISHED'
          assert r['constraint_graph']['measurement_sigma'] is None
          assert r['constraint_graph']['physical_frame'] is None
          assert r['constraint_graph']['lean_4_35_physical_predicate'] == 'NOT_PROMOTED'
          assert r['physical_simulation_and_holdout'] == 'NOT_RUN'
          assert r['status_for_conde'] == 'INDETERMINATE'
          assert len(r['source']['derived_csv_sha256']) == 64
          print('C241-L10 traceable catalog identity only: PASS')
          PY
      - name: Archive exact-head custody artifact and indexed CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l10-norad-identity-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l10/
          if-no-files-found: warn
          retention-days: 30
