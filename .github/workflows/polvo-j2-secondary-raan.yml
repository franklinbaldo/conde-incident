name: Polvo - C241-L4 J2 short-gap controls
on:
  pull_request:
    paths:
      - formal/scripts/audit_secondary_j2_raan.py
      - formal/tests/test_secondary_j2_raan.py
      - research/constraints/C241-L4_j2_short_gap_diagnostic.md
      - .github/workflows/polvo-j2-secondary-raan.yml
  push:
    branches: [main]
    paths:
      - formal/scripts/audit_secondary_j2_raan.py
      - formal/tests/test_secondary_j2_raan.py
      - research/constraints/C241-L4_j2_short_gap_diagnostic.md
      - .github/workflows/polvo-j2-secondary-raan.yml
permissions:
  contents: read
jobs:
  j2-secondary:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adversarial unit controls and existing custody regression
        run: |
          set -euo pipefail
          python3 -m unittest discover -s formal/tests -p 'test_secondary_j2_raan.py' -v
          python3 -m unittest discover -s tests -p 'test_tle_raan_continuity_1963.py' -v
      - name: Pin 1963 source and compute real short-gap J2 residuals
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyarrow==21.0.0
          python3 tools/tle_secondary_1963_ledger.py --download \
            --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --literal research/tle_custody/mirror_528_1963-10-27.tle \
            --output "$RUNNER_TEMP/c241-l4"
          python3 formal/scripts/audit_secondary_j2_raan.py \
            --csv "$RUNNER_TEMP/c241-l4/norad_527_528_529_numeric_1963.csv" \
            --output "$RUNNER_TEMP/c241-l4/polvo_j2_raan.json"
          python3 - <<'PY'
          import json,math,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"c241-l4/polvo_j2_raan.json").read_text())
          objs=r["objects"]
          assert [objs[k]["adjacent_pairs_at_most_24h"] for k in ("527","528","529")] == [0,3,3]
          assert objs["527"]["status"]=="NO_SHORT_GAP_PAIRS"
          for sat,static,j2 in (("528",0.45060223,0.0488244),("529",0.3223597,0.1408534)):
              assert math.isclose(objs[sat]["static_mae_deg"],static,rel_tol=0,abs_tol=1e-5)
              assert math.isclose(objs[sat]["j2_mae_deg"],j2,rel_tol=0,abs_tol=1e-5)
          assert r["admissible_domain_change"]=="NONE_NO_AUTHENTICATED_FRAME_OR_SENSOR_ERRORS"
          print("J2_ROUNDTRIP_REAL_SECONDARY_METRICS",json.dumps({
              sat:{"pairs":x["adjacent_pairs_at_most_24h"],
                   "static_mae_deg":x.get("static_mae_deg"),
                   "j2_mae_deg":x.get("j2_mae_deg")} for sat,x in objs.items()},sort_keys=True))
          PY
      - name: Compile Lean 4.35.0 and audit declared axioms
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formal
          lake build
          lake env lean Conde1963/CoreAxioms.lean | tee /tmp/polvo-core-axioms.log
          if grep -E 'sorryAx|unsafe|error:' /tmp/polvo-core-axioms.log; then exit 1; fi
      - name: Upload pinned numeric report and index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polvo-j2-short-gap-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l4/
          retention-days: 30
          if-no-files-found: warn
