name: UI keyboard and mobile smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/App.tsx'
      - 'src/components/LabLoadErrorBoundary.tsx'
      - 'tests/ui_lab_chunk_failure_smoke.mjs'
      - 'index.html'
      - 'vite.config.ts'
      - 'tests/lab-code-split.test.mjs'
      - 'src/components/Navigation.tsx'
      - 'src/lib/editorialRoutes.ts'
      - 'tests/editorialRoutes.test.mjs'
      - 'tests/editorial_journey_smoke.mjs'
      - 'src/components/OrbitalMap.tsx'
      - 'src/components/map/**'
      - 'tests/ui_keyboard_smoke.mjs'
      - 'tests/lab_python_export_failure_smoke.mjs'
      - 'src/components/PythonScriptModal.tsx'
      - 'tests/ui_python_modal_touch_smoke.mjs'
      - 'tests/caderno_reflow_smoke.mjs'
      - 'static/css/site.css'
      - 'scripts/localize-ssg-search.mjs'
      - 'scripts/localize-ssg-search-runtime.mjs'
      - 'tests/ssg-search-locale.test.mjs'
      - 'tests/ssg-search-runtime.test.mjs'
      - 'tests/ssg_search_dialog_smoke.mjs'
      - 'templates/template.html'
      - 'templates/tera/base.html'
      - '.github/workflows/ui-keyboard-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-keyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked app dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated Playwright without changing bun.lock/package.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ux-playwright"
          npm install --prefix "$RUNNER_TEMP/ux-playwright" --no-audit --no-fund --no-save playwright@1.56.1
          ln -s "$RUNNER_TEMP/ux-playwright/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/ux-playwright/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/ux-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start local PR HEAD web app
        shell: bash
        run: |
          set -euo pipefail
          bun run dev -- --port 3000 --host 127.0.0.1 > /tmp/conde-ui-dev.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/conde-ui-dev.log
          exit 1
      - name: Browser keyboard and desktop/mobile screenshots
        run: node tests/ui_keyboard_smoke.mjs
      - name: Chromium lazy-download failure and recovery (PT/EN)
        run: node tests/ui_lab_chunk_failure_smoke.mjs
      - name: Browser export chunk failure, modal keyboard recovery and language
        run: node tests/lab_python_export_failure_smoke.mjs
      - name: Chromium Python export controls 44px and keyboard focus
        run: node tests/ui_python_modal_touch_smoke.mjs
      - name: Caderno 320px reflow and focus in Chromium (source templates)
        run: node tests/caderno_reflow_smoke.mjs
      - name: Install pinned SSG binary for the real editorial UI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/sebastienrousseau/static-site-generator/releases/download/v0.0.75/ssg-v0.0.75-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$RUNNER_TEMP/ssg-0.0.75.tar.gz"
          printf '%s  %s\n' 'f6305109e9bec5895e9c90f97a5c569c74048b3d50823d40175e15ca99c50843' "$RUNNER_TEMP/ssg-0.0.75.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ssg-0.0.75.tar.gz" -C "$RUNNER_TEMP" ssg
          chmod 755 "$RUNNER_TEMP/ssg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build the actual Vite laboratory for the same Pages artifact
        run: VITE_BASE_PATH=/conde-incident/lab/ bun run build
      - name: Verify lazy instrument chunks and lab entry payload (UX-08)
        run: node --test tests/lab-code-split.test.mjs
      - name: Build and serve SSG Pages artifact at production prefix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-ssg.mjs
          ssg check --config ssg.toml
          ssg build --config ssg.toml
          node scripts/enable-article-frames.mjs
          mkdir -p public/css public/lab "$RUNNER_TEMP/search-audit/conde-incident"
          cp static/css/site.css public/css/site.css
          cp -R dist/. public/lab/
          cp -R public/. "$RUNNER_TEMP/search-audit/conde-incident/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/search-audit" > /tmp/conde-ssg-audit.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/conde-incident/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/conde-ssg-audit.log
          exit 1
      - name: Chromium SSG search focus, tap targets and modal keyboard paths
        run: node tests/ssg_search_dialog_smoke.mjs
      - name: Chromium editorial ↔ laboratory journeys (320px and desktop)
        run: node tests/editorial_journey_smoke.mjs
      - name: Upload screenshots and findings even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-keyboard-mobile-audit
          path: test-results/ui/
          if-no-files-found: warn
