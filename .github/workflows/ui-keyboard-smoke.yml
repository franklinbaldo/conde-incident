  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/App.tsx'
      - 'src/components/LabLoadErrorBoundary.tsx'
      - 'tests/ui_lab_chunk_failure_smoke.mjs'
      - 'vite.config.ts'
      - 'tests/lab-code-split.test.mjs'
      - 'src/components/Navigation.tsx'
      - 'src/lib/editorialRoutes.ts'
      - 'tests/editorialRoutes.test.mjs'
      - 'tests/editorial_journey_smoke.mjs'
      - 'tests/ssg_simulacoes_bridge_smoke.mjs'
      - 'pages/simulacoes/page.md'
      - 'pages/simulacoes/tles/page.md'
      - 'static/js/ssg-tle-syntax.mjs'
      - 'static/js/ssg-source-lookup-*.mjs'
      - 'scripts/ssg-source-lookup-loader.mjs'
      - 'pages/evidencias/fontes/page.md'
      - 'tests/ssg_source_lookup_smoke.mjs'
      - 'tests/ssg-tle-syntax.test.mjs'
      - 'tests/ssg_tle_syntax_smoke.mjs'
      - 'tests/ssg-authored-pages.test.mjs'
      - 'stories/2026-11-11-o-dia-em-que-dois-relatos-se-cruzaram.md'
      - 'src/components/OrbitalMap.tsx'
      - 'tests/ui_map_reflow_smoke.mjs'
      - 'tests/ui_montecarlo_reflow_smoke.mjs'
      - 'src/components/MonteCarloVisualizer.tsx'
      - 'src/components/map/**'
      - 'tests/ui_keyboard_smoke.mjs'
      - 'tests/ui_mobile_sections_smoke.mjs'
      - 'src/components/SourceCitationFeed.tsx'
      - 'tests/ui_documentary_archive_smoke.mjs'
      - 'tests/lab_python_export_failure_smoke.mjs'
      - 'src/components/PythonScriptModal.tsx'
      - 'tests/ui_python_modal_touch_smoke.mjs'
      - 'tests/caderno_reflow_smoke.mjs'
      - 'tests/ssg-mobile-nav-smoke.mjs'
      - 'tests/ssg-current-nav.test.mjs'
      - 'scripts/mark-editorial-nav.mjs'
      - 'templates/index.html'
      - 'templates/page.html'
      - 'templates/post.html'
      - 'static/css/site.css'
      - 'scripts/localize-ssg-search.mjs'
      - 'scripts/localize-ssg-search-runtime.mjs'
      - 'tests/ssg-search-locale.test.mjs'
      - 'tests/ssg-search-runtime.test.mjs'
      - 'tests/ssg_search_dialog_smoke.mjs'
      - 'tests/ssg_mobile_heading_smoke.mjs'
      - 'tests/ssg_tle_code_scroll_smoke.mjs'
      - 'tests/test_ui_keyboard_trigger_contract.py'
      - 'scripts/prepare-ssg.mjs'
      - 'scripts/enable-article-frames.mjs'
      - 'ssg.toml'
      - 'templates/template.html'
      - 'templates/tera/base.html'
      - '.github/workflows/ui-keyboard-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-keyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked app dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated Playwright without changing bun.lock/package.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ux-playwright"
          npm install --prefix "$RUNNER_TEMP/ux-playwright" --no-audit --no-fund --no-save playwright@1.56.1
          ln -s "$RUNNER_TEMP/ux-playwright/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/ux-playwright/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/ux-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start local PR HEAD web app
        shell: bash
        run: |
          set -euo pipefail
          bun run dev -- --port 3000 --host 127.0.0.1 > /tmp/conde-ui-dev.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/conde-ui-dev.log
          exit 1
      - name: Verify UI smoke event and source-only trigger coverage
        run: python3 -m unittest discover -s tests -p test_ui_keyboard_trigger_contract.py
      - name: Browser keyboard and desktop/mobile screenshots
        run: node tests/ui_keyboard_smoke.mjs
      - name: Chromium native mobile section navigation (320/375/640)
        run: node tests/ui_mobile_sections_smoke.mjs
      - name: Chromium documentary archive provenance, links and reflow (320/390/1440)
        run: node tests/ui_documentary_archive_smoke.mjs
      - name: Chromium quota-free map 200% text reflow, SVG, dates and zoom (PT/EN)
        run: node tests/ui_map_reflow_smoke.mjs
      - name: Chromium Monte Carlo 200% text reflow, accessible controls and table (PT/EN)
        run: node tests/ui_montecarlo_reflow_smoke.mjs
      - name: Chromium lazy-download failure and recovery (PT/EN)
        run: node tests/ui_lab_chunk_failure_smoke.mjs
      - name: Browser export chunk failure, modal keyboard recovery and language
        run: node tests/lab_python_export_failure_smoke.mjs
      - name: Chromium Python export controls 44px and keyboard focus
        run: node tests/ui_python_modal_touch_smoke.mjs
      - name: Caderno 320px reflow and focus in Chromium (source templates)
        run: node tests/caderno_reflow_smoke.mjs
      - name: Install pinned SSG binary for the real editorial UI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/sebastienrousseau/static-site-generator/releases/download/v0.0.75/ssg-v0.0.75-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$RUNNER_TEMP/ssg-0.0.75.tar.gz"
          printf '%s  %s\n' 'f6305109e9bec5895e9c90f97a5c569c74048b3d50823d40175e15ca99c50843' "$RUNNER_TEMP/ssg-0.0.75.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ssg-0.0.75.tar.gz" -C "$RUNNER_TEMP" ssg
          chmod 755 "$RUNNER_TEMP/ssg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build the actual Vite laboratory for the same Pages artifact
        run: VITE_BASE_PATH=/conde-incident/lab/ bun run build
      - name: Verify lazy instrument chunks and lab entry payload (UX-08)
        run: node --test tests/lab-code-split.test.mjs
      - name: Build and serve SSG Pages artifact at production prefix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-data"
          cp -a public/data/. "$RUNNER_TEMP/source-data/"
          node scripts/prepare-ssg.mjs
          ssg check --config ssg.toml
          ssg build --config ssg.toml
          cp -a "$RUNNER_TEMP/source-data/." public/data/
          node scripts/enable-article-frames.mjs
          mkdir -p public/css public/js public/lab "$RUNNER_TEMP/search-audit/conde-incident"
          cp static/css/site.css public/css/site.css
          cp -R static/js/. public/js/
          cp -R dist/. public/lab/
          cp -R public/. "$RUNNER_TEMP/search-audit/conde-incident/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/search-audit" > /tmp/conde-ssg-audit.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/conde-incident/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/conde-ssg-audit.log
          exit 1
      - name: Chromium SSG search focus, tap targets and modal keyboard paths
        run: node tests/ssg_search_dialog_smoke.mjs
      - name: Chromium native mobile SSG menu and active section (no JS, 100/200% text)
        run: node tests/ssg-mobile-nav-smoke.mjs
      - name: Chromium real SSG mobile headings, orphaned words and reflow (320/375/1440)
        run: node tests/ssg_mobile_heading_smoke.mjs
      - name: Chromium editorial ↔ laboratory journeys (320px and desktop)
        run: node tests/editorial_journey_smoke.mjs
      - name: Chromium eight SSG ↔ lab instrument pairs (320/390/1440)
        run: node tests/ssg_simulacoes_bridge_smoke.mjs
      - name: Chromium SSG standalone TLE syntax audit (320/390/1440)
        run: node tests/ssg_tle_syntax_smoke.mjs
      - name: Chromium TLE custody mobile code reflow and keyboard focus
        run: node tests/ssg_tle_code_scroll_smoke.mjs
      - name: Chromium source → occurrence → archive and fail-closed integrity (320/1440)
        run: node tests/ssg_source_lookup_smoke.mjs
      - name: Upload screenshots and findings even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-keyboard-mobile-audit
          path: test-results/ui/
          if-no-files-found: warn
