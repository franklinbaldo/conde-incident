name: UI keyboard and mobile smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/App.tsx'
      - 'src/components/Navigation.tsx'
      - 'src/components/OrbitalMap.tsx'
      - 'src/components/map/**'
      - 'tests/ui_keyboard_smoke.mjs'
      - 'tests/caderno_reflow_smoke.mjs'
      - 'static/css/site.css'
      - 'templates/template.html'
      - 'templates/tera/base.html'
      - '.github/workflows/ui-keyboard-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-keyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked app dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated Playwright without changing bun.lock/package.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ux-playwright"
          npm install --prefix "$RUNNER_TEMP/ux-playwright" --no-audit --no-fund --no-save playwright@1.56.1
          ln -s "$RUNNER_TEMP/ux-playwright/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/ux-playwright/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/ux-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start local PR HEAD web app
        shell: bash
        run: |
          set -euo pipefail
          bun run dev -- --port 3000 --host 127.0.0.1 > /tmp/conde-ui-dev.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/conde-ui-dev.log
          exit 1
      - name: Browser keyboard and desktop/mobile screenshots
        run: node tests/ui_keyboard_smoke.mjs
      - name: Caderno 320px reflow and focus in Chromium (source templates)
        run: node tests/caderno_reflow_smoke.mjs
      - name: Upload screenshots and findings even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-keyboard-mobile-audit
          path: test-results/ui/
          if-no-files-found: warn
