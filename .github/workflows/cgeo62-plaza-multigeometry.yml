name: CGEO-62 OSM named plaza ambiguity
on:
  pull_request:
    paths:
      - 'research/geo/cgeo62_praca_severino_vieira.json'
      - 'research/geo/CGEO62_PRACA_MULTIGEOMETRIA.md'
      - 'research/geo/sources/cgeo62_osm_way_*.xml'
      - 'tools/cgeo62_praca_multigeometry.py'
      - 'tests/test_cgeo62_praca_multigeometry.py'
      - '.github/workflows/cgeo62-plaza-multigeometry.yml'
  push:
    branches: [main]
    paths:
      - 'research/geo/cgeo62_praca_severino_vieira.json'
      - 'research/geo/CGEO62_PRACA_MULTIGEOMETRIA.md'
      - 'research/geo/sources/cgeo62_osm_way_*.xml'
      - 'tools/cgeo62_praca_multigeometry.py'
      - 'tests/test_cgeo62_praca_multigeometry.py'
      - '.github/workflows/cgeo62-plaza-multigeometry.yml'
permissions:
  contents: read
jobs:
  provenance-and-negative-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show -s --format='HEAD=%H TREE=%T' HEAD
      - name: Replay four original OSM XML files
        run: |
          python3 tools/cgeo62_praca_multigeometry.py
          python3 -m unittest discover -s tests -p 'test_cgeo62_praca_multigeometry.py' -v
          python3 -O -m unittest discover -s tests -p 'test_cgeo62_praca_multigeometry.py' -v

