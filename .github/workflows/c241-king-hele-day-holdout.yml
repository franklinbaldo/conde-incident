name: C241 King-Hele date-only 637/528 holdout
on:
  pull_request:
    paths:
      - tools/c241_king_hele_day_holdout.py
      - tests/test_c241_king_hele_day_holdout.py
      - research/statistics/C241_KING_HELE_DAY_HOLDOUT_20261114.md
      - .github/workflows/c241-king-hele-day-holdout.yml
  push:
    branches: [main]
    paths:
      - tools/c241_king_hele_day_holdout.py
      - tests/test_c241_king_hele_day_holdout.py
      - research/statistics/C241_KING_HELE_DAY_HOLDOUT_20261114.md
      - .github/workflows/c241-king-hele-day-holdout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  king-hele-uncalibrated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial synthetic logic tests
        run: python3 -m unittest discover -s tests -p 'test_c241_king_hele_day_holdout.py' -v
      - name: Replay SHA-pinned historical secondary source
        run: |
          set -euo pipefail
          python3 -m pip install pyarrow==21.0.0
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
            https://huggingface.co/datasets/oxzoid/space-track-tle-history/resolve/4b4fb3a/data/tle_1963.parquet \
            -o "$RUNNER_TEMP/tle_1963.parquet"
          echo 'c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09'"  $RUNNER_TEMP/tle_1963.parquet" | sha256sum -c -
          python3 tools/c241_king_hele_day_holdout.py --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --output "$RUNNER_TEMP/c241_king_hele_day_holdout.json"
          python3 - "$RUNNER_TEMP/c241_king_hele_day_holdout.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          assert len(result['comparisons']) == 5
          assert {e['norad'] for e in result['comparisons']} == {528,637}
          assert all(not e['independent_terminal_time_validation'] for e in result['comparisons'])
          assert all(e['source_rows_used_for_last_two'] for e in result['comparisons'])
          assert result['inference'] == {
              'active_constraint': False, 'terminal_time_sigma_hours': None,
              'impact_geography': None, 'historical_mcmc': 'NOT_RUN',
              'objective_validation': 'NOT_ESTABLISHED_SINGLE_CATALOGUE_LINEAGE',
              'meaning_of_H': 'retrospectively assumed, not independently measured',
              'physics_caveat': 'near-circular, approximately fixed Cd*A/m, local exponential density; no terminal altitude or ballistic coefficient observed'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c241-king-hele-date-only-${{ github.sha }}
          path: ${{ runner.temp }}/c241_king_hele_day_holdout.json
          if-no-files-found: error
          retention-days: 30
