name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Update Lake manifest and check proofs
        working-directory: formal
        run: |
          lake update
          lake build
      - name: Report theorem axioms (no sorry allowed)
        working-directory: formal
        run: |
          lake env lean Conde1963/AxiomAudit.lean | tee axiom-audit.log
          if grep -E 'sorryAx|unsafe|error\(|error:' axiom-audit.log; then
            echo 'Unexpected trusted-admission dependency in proof audit' >&2
            exit 1
          fi
      - name: Test original-ZIP intake gate (synthetic corpus ONLY)
        working-directory: formal
        run: python3 -m unittest discover -s tests -v
      - name: Verify pinned matrix rows and Git blob (not historical provenance)
        run: python3 formal/scripts/verify_matrix_refs.py research/evidence_matrix_C001-C238_2026-11-11.md
