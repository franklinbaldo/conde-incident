name: C241 688 interval holdout readiness
on:
  pull_request:
    paths:
      - tools/c241_688_terminal_holdout_readiness.py
      - tests/test_c241_688_terminal_holdout_readiness.py
      - research/statistics/C241_688_TERMINAL_HOLDOUT_READINESS_20261114.md
      - research/tle_custody/norad_spadats_context_C241-L46.json
      - .github/workflows/c241-688-terminal-readiness.yml
  push:
    branches: [main]
    paths:
      - tools/c241_688_terminal_holdout_readiness.py
      - tests/test_c241_688_terminal_holdout_readiness.py
      - research/statistics/C241_688_TERMINAL_HOLDOUT_READINESS_20261114.md
      - research/tle_custody/norad_spadats_context_C241-L46.json
      - .github/workflows/c241-688-terminal-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-688:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: SHA exacto e contraprovas adversariais
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest discover -s tests -p 'test_c241_688_terminal_holdout_readiness.py' -v
      - name: Replay do catálogo secundário com hash fixo
        run: |
          set -euo pipefail
          python3 -m pip install pyarrow==21.0.0
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
            https://huggingface.co/datasets/oxzoid/space-track-tle-history/resolve/4b4fb3a/data/tle_1963.parquet \
            -o "$RUNNER_TEMP/tle_1963.parquet"
          echo 'c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09'"  $RUNNER_TEMP/tle_1963.parquet" | sha256sum -c -
          python3 tools/c241_688_terminal_holdout_readiness.py --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --output "$RUNNER_TEMP/c241_688_terminal_readiness.json"
          python3 - "$RUNNER_TEMP/c241_688_terminal_readiness.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['objects']['688']['secondary_catalogue_epoch_count']==1
          assert r['objects']['687']['secondary_catalogue_epoch_count']==2
          assert r['terminal_report']['duration_minutes']==110
          assert r['inference']['historical_mcmc']=='NOT_RUN'
          assert not r['inference']['active_constraint_528']
          assert r['inference']['terminal_time_sigma_hours'] is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c241-688-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/c241_688_terminal_readiness.json
          if-no-files-found: error
          retention-days: 30
