name: Declassified NSA and NRO PDFs C241-L51
on:
  pull_request:
    paths:
      - 'research/tle_custody/*C241-L51*'
      - 'tools/tle_declassified_facsimiles_c241_l51.py'
      - 'tests/test_tle_declassified_facsimiles_c241_l51.py'
      - '.github/workflows/tle-declassified-facsimiles.yml'
  push:
    branches: [main]
    paths:
      - 'research/tle_custody/*C241-L51*'
      - 'tools/tle_declassified_facsimiles_c241_l51.py'
      - 'tests/test_tle_declassified_facsimiles_c241_l51.py'
      - '.github/workflows/tle-declassified-facsimiles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned page reader
        run: python -m pip install pypdf==6.1.3
      - name: Mutation tests in both interpreter modes
        run: |
          python -m unittest discover -s tests -p test_tle_declassified_facsimiles_c241_l51.py -v
          python -O -m unittest discover -s tests -p test_tle_declassified_facsimiles_c241_l51.py -v
      - name: Replay entire originals and verify SHA-256 and pagination
        run: python tools/tle_declassified_facsimiles_c241_l51.py --verify-remote --full-pdf
