name: Gaviao Caderno 08 - cross-branch source audit
on:
  pull_request:
    paths:
      - 'tools/gaviao_ch08_crossbranch.py'
      - 'tests/test_gaviao_ch08_crossbranch.py'
      - 'research/gaviao_ch08_review.md'
      - 'team/memory/gaviao/**'
      - '.github/workflows/gaviao-ch08-crossbranch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify actual tested head
        env:
          HEAD_EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_EXPECTED"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Seventeen adversarial tests
        run: python -m unittest discover -s tests -p 'test_gaviao_ch08_crossbranch.py' -v
      - name: Recheck three SHA-pinned Git blobs
        run: python tools/gaviao_ch08_crossbranch.py --pinned
