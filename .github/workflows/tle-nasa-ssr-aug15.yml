name: Tartaruga - C241-L17 NASA SSR August 1963 three-edition custody
on:
  pull_request:
    paths:
      - tools/tle_nasa_ssr_aug15_audit.py
      - tests/test_tle_nasa_ssr_aug15_audit.py
      - research/tle_custody/nasa_ssr_aug15_1963_C241-L17.json
      - research/tle_custody/evidence_matrix_C241-L17_2026-11-13.md
      - .github/workflows/tle-nasa-ssr-aug15.yml
  push:
    branches: [main]
    paths:
      - tools/tle_nasa_ssr_aug15_audit.py
      - tests/test_tle_nasa_ssr_aug15_audit.py
      - research/tle_custody/nasa_ssr_aug15_1963_C241-L17.json
      - research/tle_custody/evidence_matrix_C241-L17_2026-11-13.md
      - .github/workflows/tle-nasa-ssr-aug15.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA and adversarial cases
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p test_tle_nasa_ssr_aug15_audit.py -v
      - name: Audit official PDF bytes and documented sequences
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            https://ntrs.nasa.gov/api/citations/19630012289/downloads/19630012289.pdf \
            -o "$RUNNER_TEMP/19630012289.pdf"
          sha256sum "$RUNNER_TEMP/19630012289.pdf"
          wc -c "$RUNNER_TEMP/19630012289.pdf"
          python3 tools/tle_nasa_ssr_aug15_audit.py \
            --august research/tle_custody/nasa_ssr_aug15_1963_C241-L17.json \
            --april research/tle_custody/nasa_ssr_apr_oct_1963_C241-L16.json \
            --october research/tle_custody/nasa_ssr_1963_oct15_C241-L12.json \
            --pdf "$RUNNER_TEMP/19630012289.pdf" \
            --output "$RUNNER_TEMP/c241-l17.json"
          python3 - "$RUNNER_TEMP/c241-l17.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['record_id']=='C241-L17' and len(r['rows'])==3
          assert r['rows'][1]['publication_step_delta_min_not_physical_rate']==['-0.8','-0.9']
          assert r['instrumental_tle_found'] is False
          assert r['physical_domain_reduced'] is False
          assert r['conde_outcome']=='INDETERMINATE'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c241-l17-aug15-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l17.json
          if-no-files-found: warn
          retention-days: 30
