name: TLE NORAD 1963 Jan-Jun visual errata C241-L58
on:
  pull_request:
    paths:
      - 'research/tle_custody/*C241-L58*'
      - 'tools/tle_norad_janjun_visual_c241_l58.py'
      - 'tests/test_tle_norad_janjun_visual_c241_l58.py'
      - '.github/workflows/tle-norad-jan-jun-visual-c241-l58.yml'
  push:
    branches: [main]
    paths:
      - 'research/tle_custody/*C241-L58*'
      - 'tools/tle_norad_janjun_visual_c241_l58.py'
      - 'tests/test_tle_norad_janjun_visual_c241_l58.py'
      - '.github/workflows/tle-norad-jan-jun-visual-c241-l58.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-mapping-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact triggering SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF parser
        run: python -m pip install --disable-pip-version-check pypdf==6.1.3
      - name: Audit parent immutability, page correction, and negative controls
        run: |
          python -m unittest discover -s tests -p test_tle_norad_janjun_visual_c241_l58.py -v
          python -O -m unittest discover -s tests -p test_tle_norad_janjun_visual_c241_l58.py -v
          python tools/tle_norad_janjun_visual_c241_l58.py
      - name: Replay original NORAD source by bytes and PDF pagination
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          url = 'https://documents.theblackvault.com/documents/afhistory/norad/%28U%29%201963%20NORAD%20CONAD%20History%20Jan-Jun.pdf'
          request = urllib.request.Request(url, headers={'User-Agent': 'Conde1963-Research-Custody/1.0'})
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = response.read(12218229)
          Path('/tmp/norad-1963-jan-jun-c241-l58.pdf').write_bytes(payload)
          PY
          python tools/tle_norad_janjun_visual_c241_l58.py --pdf /tmp/norad-1963-jan-jun-c241-l58.pdf
