name: Lontra Soviet yearbook 1964 facsimile R48

on:
  pull_request:
    paths:
      - "research/tle_custody/soviet_bse1964_1963_003_C241_LONTRA_R48.json"
      - "research/tle_custody/evidence_matrix_C241-LONTRA-R48_2026-11-14.md"
      - "tools/verify_soviet_bse1964_pdf_r48.py"
      - "tests/test_soviet_bse1964_1963_003_r48.py"
      - ".github/workflows/lontra-soviet-bse1964-r48.yml"
  push:
    branches: [main]
    paths:
      - "research/tle_custody/soviet_bse1964_1963_003_C241_LONTRA_R48.json"
      - "research/tle_custody/evidence_matrix_C241-LONTRA-R48_2026-11-14.md"
      - "tools/verify_soviet_bse1964_pdf_r48.py"
      - "tests/test_soviet_bse1964_1963_003_r48.py"
      - ".github/workflows/lontra-soviet-bse1964-r48.yml"
  workflow_dispatch:

jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Real-source scope and mutation tests
        run: |
          python3 -m unittest discover -s tests -p 'test_soviet_bse1964_1963_003_r48.py' -v
          python3 -O -m unittest discover -s tests -p 'test_soviet_bse1964_1963_003_r48.py' -v
      - name: Retrieve scanned Soviet yearbook section
        run: |
          curl -fL --retry 2 --retry-delay 3 --connect-timeout 25 --max-time 240 \
            -o "$RUNNER_TEMP/bse1964_nauka.pdf" \
            https://istmat.org/files/uploads/35454/14_nauka_i_tehnika.pdf
      - name: Verify page count and binary digest
        run: |
          if ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          python3 tools/verify_soviet_bse1964_pdf_r48.py "$RUNNER_TEMP/bse1964_nauka.pdf"
