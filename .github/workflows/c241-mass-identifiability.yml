name: C241 exact mass identifiability
on:
  pull_request:
    paths:
      - tools/mass_identifiability_C241.py
      - tools/c241_stage_epoch_ambiguity.py
      - tools/mass_prior_sensitivity_C241.py
      - tests/test_mass_identifiability_C241.py
      - tests/test_c241_stage_epoch_ambiguity.py
      - tests/test_mass_prior_sensitivity_C241.py
      - research/statistics/C241_mass_identifiability_C241.md
      - research/statistics/C241_stage_epoch_ambiguity.md
      - research/statistics/C241_mass_prior_sensitivity_C241.md
      - research/tle_custody/gcat_mass_semantics_C241-L40.json
      - research/tle_custody/ferret_1500_crosssource_C241.json
      - research/statistics/C241_ferret_1500_crosssource.md
      - tools/ferret_mass_crosssource_C241.py
      - tools/ftv2313_secondary_geometry_C241.py
      - tests/test_ftv2313_secondary_geometry_C241.py
      - research/tle_custody/ftv2313_gmspazio_secondary_C241.json
      - research/statistics/C241_FTV2313_SECONDARY_GEOMETRY.md
      - tests/test_ferret_mass_crosssource_C241.py
      - .github/workflows/c241-mass-identifiability.yml
  push:
    branches: [main]
    paths:
      - tools/mass_identifiability_C241.py
      - tools/c241_stage_epoch_ambiguity.py
      - tools/mass_prior_sensitivity_C241.py
      - tests/test_mass_identifiability_C241.py
      - tests/test_c241_stage_epoch_ambiguity.py
      - tests/test_mass_prior_sensitivity_C241.py
      - research/statistics/C241_mass_identifiability_C241.md
      - research/statistics/C241_stage_epoch_ambiguity.md
      - research/statistics/C241_mass_prior_sensitivity_C241.md
      - research/tle_custody/gcat_mass_semantics_C241-L40.json
      - research/tle_custody/ferret_1500_crosssource_C241.json
      - research/statistics/C241_ferret_1500_crosssource.md
      - tools/ferret_mass_crosssource_C241.py
      - tools/ftv2313_secondary_geometry_C241.py
      - tests/test_ftv2313_secondary_geometry_C241.py
      - research/tle_custody/ftv2313_gmspazio_secondary_C241.json
      - research/statistics/C241_FTV2313_SECONDARY_GEOMETRY.md
      - tests/test_ferret_mass_crosssource_C241.py
      - .github/workflows/c241-mass-identifiability.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Exact rational tests and catalog gate
        run: |
          python3 -m unittest discover -s tests -p test_mass_identifiability_C241.py -v
          python3 -m unittest discover -s tests -p test_ferret_mass_crosssource_C241.py -v
          python3 -m unittest discover -s tests -p test_ftv2313_secondary_geometry_C241.py -v
          python3 -m tools.ftv2313_secondary_geometry_C241 > "$RUNNER_TEMP/ftv2313-geometry.json"
          python3 -m tools.ferret_mass_crosssource_C241 > "$RUNNER_TEMP/ferret-mass-crosssource.json"
          python3 -m unittest discover -s tests -p test_c241_stage_epoch_ambiguity.py -v
          python3 -m tools.c241_stage_epoch_ambiguity > "$RUNNER_TEMP/mass-stage-epoch.json"
          python3 -m unittest discover -s tests -p test_mass_prior_sensitivity_C241.py -v
          python3 -m tools.mass_prior_sensitivity_C241 > "$RUNNER_TEMP/mass-prior-only.json"
          python3 tools/mass_identifiability_C241.py > "$RUNNER_TEMP/mass-identifiability.json"
          python3 - "$RUNNER_TEMP/mass-identifiability.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["historical_mass_observation_rank"] == 0
          assert d["scenario_only_total_rank"] == 1
          assert d["scenario_total_plus_two_masses_rank"] == 3
          assert d["scenario_total_plus_three_masses_rank"] == 4
          assert d["historical_mass_posterior"] is None
          assert not d["physical_domain_reduction"]
          PY
