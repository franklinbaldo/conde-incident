name: Morcego 1963 NASA NORAD release chain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  document-policy-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify HEAD under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert provenance, negative evidence and non-activation of 528
        run: python3 -m unittest discover -s tests -p 'test_morcego_release_policy.py' -v
