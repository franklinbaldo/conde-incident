name: 🦎 Historical space-weather driver audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate-space-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression controls for workflow event deduplication
        run: python3 -m unittest discover -s tests -p 'test_texugo_weather_ci_events.py' -v
      - name: Reproduce audited GFZ and NRC inputs without network
        run: python3 tools/validate_1963_space_weather.py research/meteorology/space_weather_msise_inputs_1963_11_07_09.json
      - name: Reject prospective leakage from retrospective 1963 inputs
        run: |
          python3 tools/audit_space_weather_asof.py --check
          python3 -m unittest discover -s tests -p test_space_weather_asof.py -v
      - name: Audit causal flux backfill coverage without release-time invention
        run: |
          python3 tools/audit_causal_flux_backfill.py --check
          python3 -m unittest discover -s tests -p test_causal_flux_backfill.py -v
