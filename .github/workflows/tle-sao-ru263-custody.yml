name: TLE SAO RU263 station files C241-L53
on:
  pull_request:
    paths:
      - 'research/tle_custody/*C241-L53*'
      - 'tools/tle_sao_ru263_station_files_c241_l53.py'
      - 'tests/test_tle_sao_ru263_station_files_c241_l53.py'
      - '.github/workflows/tle-sao-ru263-custody.yml'
  push:
    branches: [main]
    paths:
      - 'research/tle_custody/*C241-L53*'
      - 'tools/tle_sao_ru263_station_files_c241_l53.py'
      - 'tests/test_tle_sao_ru263_station_files_c241_l53.py'
      - '.github/workflows/tle-sao-ru263-custody.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact triggering HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.1.3
      - name: Adversarial audit ordinary and optimized
        run: |
          python -m unittest discover -s tests -p test_tle_sao_ru263_station_files_c241_l53.py -v
          python -O -m unittest discover -s tests -p test_tle_sao_ru263_station_files_c241_l53.py -v
      - name: Independently redownload RU263 and verify original bytes, pagination and labels
        run: python tools/tle_sao_ru263_station_files_c241_l53.py --live
