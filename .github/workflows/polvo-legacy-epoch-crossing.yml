name: Polvo - C241-P5 RAAN legacy epoch crossing
on:
  pull_request:
    paths:
      - tools/raan_legacy_epoch_crossing.py
      - tests/test_raan_legacy_epoch_crossing.py
      - research/constraints/C241-P5_legacy_raan_epoch_confounding.md
      - research/tle_custody/evidence_matrix_C241-P5_2026-11-12.md
      - .github/workflows/polvo-legacy-epoch-crossing.yml
  push:
    branches: [main]
    paths:
      - tools/raan_legacy_epoch_crossing.py
      - tests/test_raan_legacy_epoch_crossing.py
      - research/constraints/C241-P5_legacy_raan_epoch_confounding.md
      - research/tle_custody/evidence_matrix_C241-P5_2026-11-12.md
      - .github/workflows/polvo-legacy-epoch-crossing.yml
permissions:
  contents: read
jobs:
  epoch-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial circular-epoch controls
        run: python3 -m unittest discover -s tests -p 'test_raan_legacy_epoch_crossing.py' -v
      - name: Pinned secondary raw data and empirical result
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyarrow==21.0.0
          python3 tools/tle_secondary_1963_ledger.py --download \
            --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --literal research/tle_custody/mirror_528_1963-10-27.tle \
            --output "$RUNNER_TEMP/p5"
          python3 tools/raan_legacy_epoch_crossing.py \
            --csv "$RUNNER_TEMP/p5/norad_527_528_529_numeric_1963.csv" \
            --output "$RUNNER_TEMP/p5/c241_p5.json"
          python3 - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'p5/c241_p5.json').read_text())
          assert x['physical_feasible_domain_reduction'].startswith('NONE')
          assert x['matched_epoch_hypothesis'].startswith('REJECTED')
          assert {k:x['objects'][k]['catalogue_bracket_count'] for k in ('527','528','529')}=={'527':1,'528':1,'529':1}
          assert 75.8<x['objects']['528']['days_between_legacy_printed_epoch_and_catalog_crossing']<76
          for k in ('527','528','529'):
              print('P5_CATALOG',k,x['objects'][k]['crossings'][0]['crossing_utc_IF_LINEAR_WITHIN_BRACKET'],x['objects'][k]['interpolation_control'])
          PY
      - name: Lean 4.35 existing theory and axiom audit (no new physical theorem)
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formal
          lake build
          lake env lean Conde1963/CoreAxioms.lean | tee /tmp/axioms.log
          if grep -E 'sorryAx|unsafe|error:' /tmp/axioms.log; then exit 1; fi
      - name: Preserve SHA-scoped numerical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polvo-p5-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p5/
          retention-days: 30
          if-no-files-found: warn
