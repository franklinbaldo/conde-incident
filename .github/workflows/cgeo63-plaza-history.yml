name: CGEO-63 praça editorial e cronologia
on:
  pull_request:
    paths:
      - 'research/geo/cgeo63_praca_editorial_variants.json'
      - 'research/geo/CGEO63_PRACA_VARIANTES_HISTORICAS.md'
      - 'tools/cgeo63_praca_editorial_variants.py'
      - 'tests/test_cgeo63_praca_editorial_variants.py'
      - '.github/workflows/cgeo63-plaza-history.yml'
  push:
    branches: [main]
    paths:
      - 'research/geo/cgeo63_praca_editorial_variants.json'
      - 'research/geo/CGEO63_PRACA_VARIANTES_HISTORICAS.md'
      - 'tools/cgeo63_praca_editorial_variants.py'
      - 'tests/test_cgeo63_praca_editorial_variants.py'
      - '.github/workflows/cgeo63-plaza-history.yml'
permissions:
  contents: read
jobs:
  provenance-and-adversarial-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact HEAD and tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show -s --format='HEAD=%H TREE=%T' HEAD
      - name: Validate source classes, prevent 1963 inference
        run: |
          python3 tools/cgeo63_praca_editorial_variants.py
          python3 -m unittest discover -s tests -p 'test_cgeo63_praca_editorial_variants.py' -v
          python3 -O -m unittest discover -s tests -p 'test_cgeo63_praca_editorial_variants.py' -v
