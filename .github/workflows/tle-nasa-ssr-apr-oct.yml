name: Tartaruga - C241-L16 NASA SSR April-October comparison
on:
  pull_request:
    paths:
      - tools/tle_nasa_ssr_apr_oct_audit.py
      - tests/test_tle_nasa_ssr_apr_oct_audit.py
      - research/tle_custody/nasa_ssr_apr_oct_1963_C241-L16.json
      - research/tle_custody/evidence_matrix_C241-L16_2026-11-12.md
      - .github/workflows/tle-nasa-ssr-apr-oct.yml
  push:
    branches: [main]
    paths:
      - tools/tle_nasa_ssr_apr_oct_audit.py
      - tests/test_tle_nasa_ssr_apr_oct_audit.py
      - research/tle_custody/nasa_ssr_apr_oct_1963_C241-L16.json
      - research/tle_custody/evidence_matrix_C241-L16_2026-11-12.md
      - .github/workflows/tle-nasa-ssr-apr-oct.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD and adversarial controls
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p test_tle_nasa_ssr_apr_oct_audit.py -v
      - name: Pin April facsimile bytes and compare October publication
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            https://ntrs.nasa.gov/api/citations/19630012128/downloads/19630012128.pdf \
            -o "$RUNNER_TEMP/19630012128.pdf"
          sha256sum "$RUNNER_TEMP/19630012128.pdf"
          wc -c "$RUNNER_TEMP/19630012128.pdf"
          python3 tools/tle_nasa_ssr_apr_oct_audit.py \
            --ledger research/tle_custody/nasa_ssr_apr_oct_1963_C241-L16.json \
            --october research/tle_custody/nasa_ssr_1963_oct15_C241-L12.json \
            --pdf "$RUNNER_TEMP/19630012128.pdf" \
            --output "$RUNNER_TEMP/c241-l16.json"
          python3 - "$RUNNER_TEMP/c241-l16.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert [x["published_delta_period_min_not_physical_rate"] for x in r["rows"]] == ["0.0", "-1.7", "-1.0"]
          assert r["physical_domain_reduced"] is False
          assert r["primary_tle_pairs_found"] is False
          assert r["conde_outcome"] == "INDETERMINATE"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c241-l16-apr-oct-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l16.json
          if-no-files-found: warn
          retention-days: 30
