name: Tartaruga - C241-L22 NASA SSR June 30 1963 source custody
on:
  pull_request:
    paths:
      - tools/tle_nasa_ssr_jun30_audit.py
      - tests/test_tle_nasa_ssr_jun30_audit.py
      - research/tle_custody/nasa_ssr_jun30_1963_C241-L22.json
      - research/tle_custody/evidence_matrix_C241-L22_2026-11-13.md
      - research/constraints/ssr_jun30_1963_observables_C241-L22.json
      - .github/workflows/tle-nasa-ssr-jun30.yml
  push:
    branches: [main]
    paths:
      - tools/tle_nasa_ssr_jun30_audit.py
      - tests/test_tle_nasa_ssr_jun30_audit.py
      - research/tle_custody/nasa_ssr_jun30_1963_C241-L22.json
      - research/tle_custody/evidence_matrix_C241-L22_2026-11-13.md
      - research/constraints/ssr_jun30_1963_observables_C241-L22.json
      - .github/workflows/tle-nasa-ssr-jun30.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD and adversarial tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p test_tle_nasa_ssr_jun30_audit.py -v
      - name: Download and verify NASA real PDF bytes
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            https://ntrs.nasa.gov/api/citations/19630012130/downloads/19630012130.pdf \
            -o "$RUNNER_TEMP/19630012130.pdf"
          sha256sum "$RUNNER_TEMP/19630012130.pdf"
          wc -c "$RUNNER_TEMP/19630012130.pdf"
          python3 tools/tle_nasa_ssr_jun30_audit.py \
            --ledger research/tle_custody/nasa_ssr_jun30_1963_C241-L22.json \
            --graph research/constraints/ssr_jun30_1963_observables_C241-L22.json \
            --april research/tle_custody/nasa_ssr_apr_oct_1963_C241-L16.json \
            --july-dec research/tle_custody/nasa_ssr_jul_dec_1963_C241-L18.json \
            --august research/tle_custody/nasa_ssr_aug15_1963_C241-L17.json \
            --pdf "$RUNNER_TEMP/19630012130.pdf" \
            --output "$RUNNER_TEMP/c241-l22.json"
          python3 - "$RUNNER_TEMP/c241-l22.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['source_ntrs']=='19630012130'
          assert r['documentary_period_528_min']==['94.1','93.7','93.6','93.3']
          assert r['physical_constraints_activated']==0
          assert r['independent_instrument_measurements_added']==0
          assert r['pdf_bytes_verified']==274564
          assert r['conde']=='INDETERMINATE'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c241-l22-jun30-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l22.json
          if-no-files-found: warn
          retention-days: 30
