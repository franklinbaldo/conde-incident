name: Tartaruga - C241-L5 n-dot BSTAR lineage

on:
  pull_request:
    paths:
      - tools/tle_drag_term_lineage_audit.py
      - tests/test_tle_drag_term_lineage_audit.py
      - research/tle_custody/evidence_matrix_C241-L5_2026-11-12.md
      - .github/workflows/tle-drag-lineage.yml
  push:
    branches: [main]
    paths:
      - tools/tle_drag_term_lineage_audit.py
      - tests/test_tle_drag_term_lineage_audit.py
      - research/tle_custody/evidence_matrix_C241-L5_2026-11-12.md
      - .github/workflows/tle-drag-lineage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  line1-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "audited_source_head=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 13 synthetic adversarial controls and custody regressions
        run: |
          python -m unittest discover -s tests -p 'test_tle_drag_term_lineage_audit.py' -v
          python -m unittest discover -s tests -p 'test_tle_literal_layout.py' -v
          python -m unittest discover -s tests -p 'test_tle_secondary_1963_ledger.py' -v
      - name: Install fixed Parquet decoder
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: SHA-verify secondary source and generate row-indexed CSV
        run: |
          python tools/tle_secondary_1963_ledger.py --download \
            --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --literal research/tle_custody/mirror_528_1963-10-27.tle \
            --output "$RUNNER_TEMP/c241-l5"
          python tools/tle_drag_term_lineage_audit.py \
            --csv "$RUNNER_TEMP/c241-l5/norad_527_528_529_numeric_1963.csv" \
            --pair research/tle_custody/mirror_528_1963-10-27.tle \
            --output "$RUNNER_TEMP/c241-l5/line1_drag_terms_c241_l5.json"
      - name: Fail closed on pinned source and interpretive guards
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'c241-l5/line1_drag_terms_c241_l5.json').read_text())
          assert r['rows'] == 123
          assert [(r['by_norad'][x]['rows'], r['by_norad'][x]['unique_epochs']) for x in ('527', '528', '529')] == [(21,20),(45,45),(57,54)]
          assert all(r['by_norad'][x]['bstar_zero'] == r['by_norad'][x]['rows'] for x in ('527', '528', '529'))
          assert all(r['by_norad'][x]['n_dot_nonzero'] == r['by_norad'][x]['rows'] for x in ('527', '528', '529'))
          assert r['same_epoch_528']['source_row'] == 3017
          assert r['same_epoch_528']['numeric_scale_test'] == 'MATCHES_TLE_ENCODED_HALF'
          assert r['same_epoch_528']['parquet_n_ddot_over_six'] == 'COLUMN_ABSENT'
          assert r['constraint_link']['state'] == 'CONNECTED_PENDING_CALIBRATION'
          assert r['constraint_link']['uncertainty_sigma'] is None
          assert r['constraint_link']['physical_predicate_Lean_4_35_0'] == 'NOT_PROMOTED'
          assert r['lean_physical_premise'] == 'NOT_PROMOTED'
          assert r['conde'] == 'INDETERMINATE'
          print('C241-L5 pinned lineage and non-inference controls: PASS')
          PY
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l5-line1-lineage-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l5/
          if-no-files-found: warn
          retention-days: 30
