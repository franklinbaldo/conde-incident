name: Quest 1995 stage provenance C241-L50
on:
  pull_request:
    paths:
      - 'research/tle_custody/quest_stage_C241-L50.json'
      - 'research/tle_custody/evidence_matrix_C241-L50_2026-11-14.md'
      - 'tools/tle_quest_stage_c241_l50.py'
      - 'tests/test_tle_quest_stage_c241_l50.py'
      - '.github/workflows/tle-quest-stage.yml'
  push:
    branches: [main]
    paths:
      - 'research/tle_custody/quest_stage_C241-L50.json'
      - 'research/tle_custody/evidence_matrix_C241-L50_2026-11-14.md'
      - 'tools/tle_quest_stage_c241_l50.py'
      - 'tests/test_tle_quest_stage_c241_l50.py'
      - '.github/workflows/tle-quest-stage.yml'
  workflow_dispatch:
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF reader
        run: python -m pip install pypdf==6.1.3
      - name: Check evidence boundaries in ordinary and optimized interpreters
        run: |
          python -m unittest discover -s tests -p test_tle_quest_stage_c241_l50.py -v
          python -O -m unittest discover -s tests -p test_tle_quest_stage_c241_l50.py -v
      - name: Compare original PDF hash, bytes, pagination and text layer
        run: python tools/tle_quest_stage_c241_l50.py --verify-remote
