name: C241-L63 NASA SSR 668 documentary day
on:
  pull_request:
    paths:
      - "research/tle_custody/nasa_ssr_terminal_control_668_C241-L63.*"
      - "tools/tle_ssr_668_c241_l63.py"
      - "tests/test_tle_ssr_668_c241_l63.py"
      - ".github/workflows/tle-ssr-668-c241-l63.yml"
  push:
    branches: [main]
    paths:
      - "research/tle_custody/nasa_ssr_terminal_control_668_C241-L63.*"
      - "tools/tle_ssr_668_c241_l63.py"
      - "tests/test_tle_ssr_668_c241_l63.py"
      - ".github/workflows/tle-ssr-668-c241-l63.yml"
  workflow_dispatch:
jobs:
  original-day-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate normal and optimized Python
        run: |
          python -m unittest discover -s tests -p 'test_tle_ssr_668_c241_l63.py' -v
          python -O -m unittest discover -s tests -p 'test_tle_ssr_668_c241_l63.py' -v
      - uses: astral-sh/setup-uv@v6
      - name: Fetch and authenticate original NASA PDF
        run: |
          curl -fLsS --retry 2 --max-time 90 "https://ntrs.nasa.gov/api/citations/19640000428/downloads/19640000428.pdf" -o /tmp/19640000428.pdf
          python tools/tle_ssr_668_c241_l63.py --pdf /tmp/19640000428.pdf
          uv run --with pypdf==6.1.3 python -c "from pypdf import PdfReader; assert len(PdfReader('/tmp/19640000428.pdf').pages) == 9"
