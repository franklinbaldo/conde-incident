name: Gaviao Caderno 07 corrigido - independent audit
on:
  pull_request:
    paths:
      - 'tools/gaviao_ch07_recheck.py'
      - 'tests/test_gaviao_ch07_recheck.py'
      - 'research/gaviao_ch07_recheck.md'
      - 'team/memory/gaviao/**'
      - '.github/workflows/gaviao-ch07-recheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify SHA of HEAD actually tested
        env:
          HEAD_EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_EXPECTED"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fourteen adversarial tests
        run: python -m unittest discover -s tests -p 'test_gaviao_ch07_recheck.py' -v
      - name: Recheck corrected chapter SHA and bounded factual claims
        run: python tools/gaviao_ch07_recheck.py --pinned
