name: "GCAT 1176kg mass-field provenance C241-L40"
on:
  pull_request:
    paths:
      - research/tle_custody/gcat_mass_semantics_C241-L40.json
      - research/tle_custody/evidence_matrix_C241-L40_2026-11-13.md
      - research/tle_custody/evidence_matrix_C241-L39_2026-11-13.md
      - tools/gcat_mass_semantics_C241_L40.py
      - tests/test_gcat_mass_semantics_C241_L40.py
      - .github/workflows/tle-gcat-mass-semantics.yml
  push:
    branches: [main]
    paths:
      - research/tle_custody/gcat_mass_semantics_C241-L40.json
      - research/tle_custody/evidence_matrix_C241-L40_2026-11-13.md
      - research/tle_custody/evidence_matrix_C241-L39_2026-11-13.md
      - tools/gcat_mass_semantics_C241_L40.py
      - tests/test_gcat_mass_semantics_C241_L40.py
      - .github/workflows/tle-gcat-mass-semantics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mass-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD and adversarial tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p 'test_gcat_mass_semantics_C241_L40.py' -v
          python3 scripts/check_file_size.py
      - name: Replay six hash-pinned GCAT sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1]) / "gcat-C241-L40"
          root.mkdir(exist_ok=True, parents=True)
          manifest = json.load(open("research/tle_custody/gcat_mass_semantics_C241-L40.json"))
          for filename, record in manifest["files"].items():
              subprocess.run(
                  ["curl", "--fail", "--location", "--silent", "--show-error",
                   "--connect-timeout", "20", "--max-time", "180",
                   record["url"], "--output", str(root / filename)],
                  check=True,
              )
          PY
          python3 tools/gcat_mass_semantics_C241_L40.py --source-dir "$RUNNER_TEMP/gcat-C241-L40"
          echo "GCAT_SOURCE_SEMANTICS_PASS=1"
      - name: Preserve ledger without binary downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l40-ledger-${{ github.event.pull_request.head.sha || github.sha }}
          path: research/tle_custody/gcat_mass_semantics_C241-L40.json
          retention-days: 30
