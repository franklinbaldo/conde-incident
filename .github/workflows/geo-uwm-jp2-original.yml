name: CGEO-34 original UWM JPEG 2000 custody
on:
  pull_request:
    paths:
      - 'research/geo/cgeo34_uwm_original_jp2_custody.*'
      - 'research/geo/cgeo35_uwm_jp2_raster_anchors.*'
      - 'tools/cgeo35_uwm_raster.py'
      - 'tests/test_cgeo35_uwm_raster.py'
      - 'research/geo/evidence/cgeo34_uwm_jp2_header.hex'
      - 'tools/cgeo34_uwm_jp2.py'
      - 'tests/test_cgeo34_uwm_jp2.py'
      - '.github/workflows/geo-uwm-jp2-original.yml'
  push:
    branches: [main]
    paths:
      - 'research/geo/cgeo34_uwm_original_jp2_custody.*'
      - 'research/geo/cgeo35_uwm_jp2_raster_anchors.*'
      - 'tools/cgeo35_uwm_raster.py'
      - 'tests/test_cgeo35_uwm_raster.py'
      - 'research/geo/evidence/cgeo34_uwm_jp2_header.hex'
      - 'tools/cgeo34_uwm_jp2.py'
      - 'tests/test_cgeo34_uwm_jp2.py'
      - '.github/workflows/geo-uwm-jp2-original.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archival-byte-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate source metadata and adversarial tests
        run: |
          python3 -m tools.cgeo34_uwm_jp2
          python3 -m tools.cgeo35_uwm_raster
          python3 -m unittest discover -s tests -p 'test_cgeo35_uwm_raster.py' -v
          python3 -m unittest discover -s tests -p 'test_cgeo34_uwm_jp2.py' -v
      - name: Acquire 110 MB original from UWM and replay exact bytes
        run: |
          # UWM ignores byte-range probes (HTTP 200); short retries restart 110 MB downloads.
          # Allow one bounded uninterrupted transfer; Python below still checks size and SHA256.
          curl --fail --show-error --silent --location --connect-timeout 25 --max-time 780 \
            'https://collections.lib.uwm.edu/digital/api/collection/agdm/id/10814/download' \
            --output "$RUNNER_TEMP/uwm-agdm-10814.jp2"
          python3 -m tools.cgeo34_uwm_jp2 --original "$RUNNER_TEMP/uwm-agdm-10814.jp2"
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==13.0.0
          python3 -m tools.cgeo35_uwm_raster --original "$RUNNER_TEMP/uwm-agdm-10814.jp2"
