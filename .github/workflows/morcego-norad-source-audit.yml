name: Morcego 1963 NORAD source-date provenance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  date-source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert final head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test documentary years, source family and disconnected physical domain
        run: python3 -m unittest discover -s tests -p 'test_morcego_norad_date_provenance.py' -v
