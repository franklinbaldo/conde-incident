name: Lean 4.35 core proof audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lean-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and audit axioms
        working-directory: formal
        run: |
          set -euo pipefail
          lake build
          lake env lean Conde1963/CoreAxioms.lean | tee core-axioms.log
          if grep -E 'sorryAx|unsafe|error:' core-axioms.log; then
            exit 1
          fi
      - name: Audit restored 154-row legacy evidence and C144-C151 ID reuse
        run: |
          set -euo pipefail
          python3 formal/scripts/audit_legacy_154.py > legacy-audit.json
          python3 -m unittest discover -s formal/tests -p 'test_legacy_evidence.py' -v
          cat legacy-audit.json
