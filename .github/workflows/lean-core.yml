name: Lean 4.35 core proof audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lean-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and audit axioms
        working-directory: formal
        run: |
          set -euo pipefail
          lake build
          lake env lean Conde1963/CoreAxioms.lean | tee core-axioms.log
          if grep -E 'sorryAx|unsafe|error:' core-axioms.log; then
            exit 1
          fi
      - name: Verify curated documentary Cnn occurrence bridge to Lean
        run: |
          set -euo pipefail
          python3 formal/scripts/compile_documentary_links.py --check
          python3 -m unittest discover -s formal/tests -p 'test_documentary_links.py' -v
      - name: Check NORAD documentary identity and Lean crosswalk (not tracking)
        run: |
          set -euo pipefail
          python3 tools/export_norad_context.py --check
          python3 formal/scripts/compile_norad_context.py --check
          python3 -m unittest discover -s formal/tests -p 'test_norad_context.py' -v
      - name: Verify Wayback PDF provenance and typed NASA/NTRS citation lineage
        run: |
          set -euo pipefail
          python3 tools/export_wayback_citation_links.py --check-site
          python3 formal/scripts/compile_wayback_citations.py --check
          python3 -m unittest discover -s formal/tests -p 'test_wayback_citations.py' -v
      - name: Validate Y20175 candidate wind provenance and Lean export
        run: |
          set -euo pipefail
          python3 formal/scripts/compile_nmc_candidate.py --check
          python3 tools/export_archive_documentary_links.py --check-site
          python3 tools/export_nmc_on20_layout_link.py --check
          python3 formal/scripts/compile_nmc_layout_link.py --check
          python3 -m unittest discover -s formal/tests -p 'test_nmc_candidate.py' -v
          python3 tools/verify_nmc_y20175.py
      - name: Audit restored 154-row legacy evidence and C144-C151 ID reuse
        run: |
          set -euo pipefail
          python3 formal/scripts/audit_legacy_154.py > legacy-audit.json
          python3 -m unittest discover -s formal/tests -p 'test_legacy_evidence.py' -v
          cat legacy-audit.json
      - name: Check NASA April/October printed period bounds (not tracking epochs)
        run: |
          set -euo pipefail
          python3 formal/scripts/compile_ssr_print_intervals.py --check
          python3 -m unittest discover -s formal/tests -p 'test_ssr_print_intervals.py' -v

      - name: Verify NASA April/August/October shared rounding and Lean ranks
        run: |
          set -euo pipefail
          python3 formal/scripts/compile_ssr_three_editions.py --check
          python3 -m unittest discover -s formal/tests -p 'test_ssr_three_editions.py' -v

      - name: Validate NASA November source-locked fields and Lean conditional comparisons
        run: |
          set -euo pipefail
          python3 tools/export_ssr_source_locked_links.py --check-site
          python3 formal/scripts/compile_ssr_november.py --check
          python3 -m unittest discover -s formal/tests -p 'test_ssr_november.py' -v

      - name: Falsify common NASA edition offset under printed rounding (C241-P12)
        run: |
          set -euo pipefail
          python3 formal/scripts/compile_ssr_edition_offset.py --check
          python3 -m unittest discover -s formal/tests -p 'test_ssr_edition_offset.py' -v
      - name: Certify sharp common-edition nuisance bound (C241-P13)
        run: |
          set -euo pipefail
          python3 -m formal.scripts.compile_ssr_offset_threshold --check
          python3 -m unittest discover -s formal/tests -p 'test_ssr_offset_threshold.py' -v

      - name: Check cartographic and Blue Book documentary handoffs (no physical inference)
        run: |
          set -euo pipefail
          python3 tools/export_historical_dependency_links.py --check
          python3 -m unittest discover -s tests -p 'test_historical_dependency_links.py' -v
