name: C241 November 8 bilateral date error and Monte Carlo sensitivity
on:
  pull_request:
    paths:
      - src/lib/catalogDayLikelihood.ts
      - src/lib/monteCarlo.ts
      - src/components/MonteCarloVisualizer.tsx
      - tests/catalogDayLikelihood.test.mjs
      - tools/audit_nov8_two_sided_day.py
      - tests/test_nov8_two_sided_day.py
      - research/constraints/C241_nov8_two_sided_day_likelihood_2026-11-13.json
      - research/statistics/C241_nov8_two_sided_day_likelihood_2026-11-13.md
      - .github/workflows/c241-nov8-two-sided-date.yml
  push:
    branches: [main]
    paths:
      - src/lib/catalogDayLikelihood.ts
      - src/lib/monteCarlo.ts
      - src/components/MonteCarloVisualizer.tsx
      - tests/catalogDayLikelihood.test.mjs
      - tools/audit_nov8_two_sided_day.py
      - tests/test_nov8_two_sided_day.py
      - research/constraints/C241_nov8_two_sided_day_likelihood_2026-11-13.json
      - research/statistics/C241_nov8_two_sided_day_likelihood_2026-11-13.md
      - .github/workflows/c241-nov8-two-sided-date.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit C197 primary and conditional bilateral tails
        run: |
          python3 -m unittest discover -s tests -p test_nov8_two_sided_day.py -v
          python3 tools/audit_nov8_two_sided_day.py --output "$RUNNER_TEMP/nov8-two-sided-day.json"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts --legacy-peer-deps
      - name: Test bilateral calendar likelihood and Monte Carlo UI typings
        run: |
          node --import tsx --test tests/catalogDayLikelihood.test.mjs
          npm run lint
      - name: Archive C197 dated-source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-nov8-two-sided-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nov8-two-sided-day.json
          if-no-files-found: warn
          retention-days: 30
