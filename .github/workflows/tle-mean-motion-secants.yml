name: Tartaruga - C241-L6 mean-motion secants
on:
  pull_request:
    paths:
      - tools/tle_mean_motion_secant_audit.py
      - tests/test_tle_mean_motion_secant_audit.py
      - research/tle_custody/evidence_matrix_C241-L6_2026-11-12.md
      - .github/workflows/tle-mean-motion-secants.yml
      - tools/ssr_epoch_window_g40.py
      - tests/test_ssr_epoch_window_g40.py
      - research/constraints/CASTOR-G40_ssr_epoch_window_sensitivity.json
  push:
    branches: [main]
    paths:
      - tools/tle_mean_motion_secant_audit.py
      - tests/test_tle_mean_motion_secant_audit.py
      - research/tle_custody/evidence_matrix_C241-L6_2026-11-12.md
      - .github/workflows/tle-mean-motion-secants.yml
      - tools/ssr_epoch_window_g40.py
      - tests/test_ssr_epoch_window_g40.py
      - research/constraints/CASTOR-G40_ssr_epoch_window_sensitivity.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secant-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "audited_source_head=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adversarial controls and custody regressions
        run: |
          python -m unittest discover -s tests -p 'test_tle_mean_motion_secant_audit.py' -v
          python -m unittest discover -s tests -p 'test_tle_secondary_1963_ledger.py' -v
          python -m unittest discover -s tests -p 'test_tle_literal_layout.py' -v
      - name: Install fixed Parquet decoder
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: SHA-check secondary ledger and compute secants
        run: |
          python tools/tle_secondary_1963_ledger.py --download --parquet "$RUNNER_TEMP/tle_1963.parquet" --literal research/tle_custody/mirror_528_1963-10-27.tle --output "$RUNNER_TEMP/c241-l6"
          python tools/tle_mean_motion_secant_audit.py --csv "$RUNNER_TEMP/c241-l6/norad_527_528_529_numeric_1963.csv" --output "$RUNNER_TEMP/c241-l6/mean_motion_secants_c241_l6.json"
      - name: Audit publication-cutoff sensitivity without invented instrument epoch
        env:
          CASTOR_G40_CSV: ${{ runner.temp }}/c241-l6/norad_527_528_529_numeric_1963.csv
        run: |
          python -m unittest discover -s tests -p 'test_ssr_epoch_window_g40.py' -v
          python tools/ssr_epoch_window_g40.py --csv "$CASTOR_G40_CSV" --check
      - name: Assert corpus counts and scientific non-inference
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'c241-l6/mean_motion_secants_c241_l6.json').read_text())
          assert (r['raw_rows'],r['distinct_epochs']) == (123,119)
          assert (r['global']['pairs'],r['global']['positive_dots_but_decreasing_n']) == (116,4)
          up72=[r['by_norad'][str(i)]['up_to_72h'] for i in (527,528,529)]
          assert (sum(x['pairs'] for x in up72),sum(x['positive_dots_but_decreasing_n'] for x in up72)) == (29,2)
          assert r['provenance']['derived_csv_sha256']=='3940715d7c15cf15c24e678a8c5b5fbb34a031b3ffd7e33c0580277377383231'
          assert r['constraint_link']['state']=='CONNECTED_PENDING_CALIBRATION'
          assert r['constraint_link']['sensor_error_covariance'] is None
          assert r['constraint_link']['candidate_Lean_4_35_0_predicate']=='NOT_PROMOTED'
          assert r['conde']=='INDETERMINATE'
          print('C241-L6 SHA-pinned secants: PASS')
          PY
      - name: Archive exact-head report and CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l6-secants-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l6/
          if-no-files-found: warn
          retention-days: 30
