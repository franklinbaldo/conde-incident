name: NORAD 527-529 custody (historical numeric mirror)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tle-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # pull_request defaults to refs/pull/N/merge; custody must test the exact head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked-out SHA is the exact source head
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "audited_source_head=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic controls (no historical claims)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install read-only Parquet decoder
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Fetch pinned 1963 source, verify SHA256, audit 527/528/529
        run: |
          python tools/audit_norad_1963.py \
            --parquet "${{ runner.temp }}/tle_1963.parquet" --download \
            --output "${{ runner.temp }}/tle-audit"
          cat "${{ runner.temp }}/tle-audit/audit.json"
      - name: Falsify legacy 528 six-field vector against pinned epochs
        run: |
          python tools/legacy_528_fingerprint.py \
            --csv "${{ runner.temp }}/tle-audit/norad_528_epochs_1963.csv" \
            --output "${{ runner.temp }}/tle-audit/legacy_528_fingerprint.json"
          cat "${{ runner.temp }}/tle-audit/legacy_528_fingerprint.json"
      - name: Test 527-529 epoch support without orbital interpolation
        run: |
          python tools/cross_object_epoch_support.py \
            --csv "${{ runner.temp }}/tle-audit/norad_527_528_529_1963_numeric.csv" \
            --output "${{ runner.temp }}/tle-audit/cross_object_epoch_support.json"
          cat "${{ runner.temp }}/tle-audit/cross_object_epoch_support.json"
      - name: Preserve normalized source-derived rows and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norad-1963-numeric-custody-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/tle-audit/
          if-no-files-found: warn
          retention-days: 30
