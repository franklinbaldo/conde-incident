name: C241 NORAD 637 near-decay catalogue holdout
on:
  pull_request:
    paths:
      - tools/c241_637_regime_holdout.py
      - tests/test_c241_637_regime_holdout.py
      - research/statistics/C241_637_REGIME_HOLDOUT_20261114.md
      - research/statistics/c241_637_regime_holdout_20261114.json
      - .github/workflows/c241-637-regime-holdout.yml
      - tests/test_c241_ci_workflows.py
  push:
    branches: [main]
    paths:
      - tools/c241_637_regime_holdout.py
      - tests/test_c241_637_regime_holdout.py
      - research/statistics/C241_637_REGIME_HOLDOUT_20261114.md
      - research/statistics/c241_637_regime_holdout_20261114.json
      - .github/workflows/c241-637-regime-holdout.yml
      - tests/test_c241_ci_workflows.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  norad-637:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial logic tests (synthetic fixtures only)
        run: |
          python3 -m unittest discover -s tests -p test_c241_637_regime_holdout.py -v
          python3 -m unittest discover -s tests -p test_c241_ci_workflows.py -v
      - name: Download pinned secondary archive and verify exact historical replay
        run: |
          set -euo pipefail
          python3 -m pip install pyarrow==21.0.0
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
            https://huggingface.co/datasets/oxzoid/space-track-tle-history/resolve/4b4fb3a/data/tle_1963.parquet \
            -o "$RUNNER_TEMP/tle_1963.parquet"
          echo 'c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09'"  $RUNNER_TEMP/tle_1963.parquet" | sha256sum -c -
          python3 tools/c241_637_regime_holdout.py --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --output research/statistics/c241_637_regime_holdout_20261114.json --check
