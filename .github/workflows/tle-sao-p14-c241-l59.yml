name: C241-L59 SAO P14 A1 time and custody

on:
  pull_request:
    paths:
      - "research/tle_custody/sao_p14_a1_clock_1963_C241-L59.*"
      - "tools/tle_sao_p14_a1_c241_l59.py"
      - "tests/test_tle_sao_p14_a1_c241_l59.py"
      - ".github/workflows/tle-sao-p14-c241-l59.yml"
  push:
    branches: [main]
    paths:
      - "research/tle_custody/sao_p14_a1_clock_1963_C241-L59.*"
      - "tools/tle_sao_p14_a1_c241_l59.py"
      - "tests/test_tle_sao_p14_a1_c241_l59.py"
      - ".github/workflows/tle-sao-p14-c241-l59.yml"
  workflow_dispatch:

jobs:
  custody:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked out exact event SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: astral-sh/setup-uv@v6
      - name: Adversarial tests in both Python modes
        run: |
          python -m unittest discover -s tests -p 'test_tle_sao_p14_a1_c241_l59.py' -v
          python -O -m unittest discover -s tests -p 'test_tle_sao_p14_a1_c241_l59.py' -v
      - name: Replay original NTRS bytes, page count and method
        run: |
          curl -fLsS --retry 2 --max-time 90 \
            'https://ntrs.nasa.gov/api/citations/19660001360/downloads/19660001360.pdf' -o /tmp/sao-p14.pdf
          uv run --with pypdf==6.1.3 python tools/tle_sao_p14_a1_c241_l59.py --pdf /tmp/sao-p14.pdf
