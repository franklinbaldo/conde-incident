name: Tartaruga - pinned secondary epochs 527-529

on:
  pull_request:
    paths:
      - tools/tle_secondary_1963_ledger.py
      - tests/test_tle_secondary_1963_ledger.py
      - research/tle_custody/evidence_matrix_C241-L2_2026-11-12.md
      - .github/workflows/tle-secondary-epochs.yml
  push:
    branches: [main]
    paths:
      - tools/tle_secondary_1963_ledger.py
      - tests/test_tle_secondary_1963_ledger.py
      - research/tle_custody/evidence_matrix_C241-L2_2026-11-12.md
      - .github/workflows/tle-secondary-epochs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "audited_source_head=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Twelve synthetic adversarial tests
        run: python -m unittest discover -s tests -p 'test_tle_secondary_1963_ledger.py' -v
      - name: Verify literal TLE custody already on main
        run: python -m unittest discover -s tests -p 'test_tle_literal_layout.py' -v
      - name: Install fixed Parquet decoder
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Download SHA-pinned numeric mirror and generate row-indexed ledgers
        run: |
          python tools/tle_secondary_1963_ledger.py \
            --parquet "$RUNNER_TEMP/tle_1963.parquet" --download \
            --literal research/tle_custody/mirror_528_1963-10-27.tle \
            --output "$RUNNER_TEMP/tartaruga-ledger"
          cat "$RUNNER_TEMP/tartaruga-ledger/ledger.json"
      - name: Upload source-head custody evidence even on a failed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l2-secondary-epochs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/tartaruga-ledger/
          if-no-files-found: warn
          retention-days: 30
