name: Orbital Cartesian kernel
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  numerical-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cartesian RK4, J2, drag, events and synthetic inverse tests
        run: node --experimental-strip-types --test tests/orbitPhysics.test.mjs tests/orbitConvergence.test.mjs tests/orbitSpaceWeatherAdapter.test.mjs tests/orbitGeodeticFrame.test.mjs tests/orbitFrameKinematics.test.mjs tests/orbitFrameCovariance.test.mjs tests/orbitStateTransition.test.mjs tests/orbitStmEnvelope.test.mjs
