name: CGEO-61 CONDER seat proxy
on:
  pull_request:
    paths:
      - 'research/geo/cgeo61_conder_sede_point.json'
      - 'research/geo/CGEO61_CONDER_SEDE_PROXY.md'
      - 'research/geo/cgeo60_modern_osm_cut.json'
      - 'tools/cgeo61_conder_sede_point.py'
      - 'tests/test_cgeo61_conder_sede_point.py'
      - '.github/workflows/cgeo61-conder-seat.yml'
  push:
    branches: [main]
    paths:
      - 'research/geo/cgeo61_conder_sede_point.json'
      - 'research/geo/CGEO61_CONDER_SEDE_PROXY.md'
      - 'research/geo/cgeo60_modern_osm_cut.json'
      - 'tools/cgeo61_conder_sede_point.py'
      - 'tests/test_cgeo61_conder_sede_point.py'
      - '.github/workflows/cgeo61-conder-seat.yml'
permissions:
  contents: read
jobs:
  provenance-and-negative-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show -s --format='HEAD=%H TREE=%T' HEAD
      - name: Validate contract and 24 adversarial cases
        run: |
          python3 tools/cgeo61_conder_sede_point.py
          python3 -m unittest discover -s tests -p 'test_cgeo61_conder_sede_point.py' -v
          python3 -O -m unittest discover -s tests -p 'test_cgeo61_conder_sede_point.py' -v
      - name: Read current CONDER source bytes and compare semantics
        run: python3 tools/cgeo61_conder_sede_point.py --live
