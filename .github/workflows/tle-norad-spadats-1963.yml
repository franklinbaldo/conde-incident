name: NORAD 1963 SPADATS source scope C241-L52
on:
  pull_request:
    paths:
      - 'research/tle_custody/*C241-L52*'
      - 'tools/tle_norad_spadats_scope_c241_l52.py'
      - 'tests/test_tle_norad_spadats_scope_c241_l52.py'
      - '.github/workflows/tle-norad-spadats-1963.yml'
  push:
    branches: [main]
    paths:
      - 'research/tle_custody/*C241-L52*'
      - 'tools/tle_norad_spadats_scope_c241_l52.py'
      - 'tests/test_tle_norad_spadats_scope_c241_l52.py'
      - '.github/workflows/tle-norad-spadats-1963.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned page reader
        run: python -m pip install pypdf==6.1.3
      - name: Test normal and optimized Python
        run: |
          python -m unittest discover -s tests -p test_tle_norad_spadats_scope_c241_l52.py -v
          python -O -m unittest discover -s tests -p test_tle_norad_spadats_scope_c241_l52.py -v
      - name: Replay 1963 source bytes and verify pagination
        run: python tools/tle_norad_spadats_scope_c241_l52.py --verify-remote
