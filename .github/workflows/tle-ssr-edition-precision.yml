name: Tartaruga C241-L27 NASA SSR nine-edition print precision
on:
  pull_request:
    paths:
      - research/tle_custody/nasa_ssr_editions_precision_C241-L27.json
      - research/tle_custody/evidence_matrix_C241-L27_2026-11-13.md
      - tools/tle_ssr_editions_precision_audit.py
      - tests/test_tle_ssr_editions_precision_audit.py
      - .github/workflows/tle-ssr-edition-precision.yml
  push:
    branches: [main]
    paths:
      - research/tle_custody/nasa_ssr_editions_precision_C241-L27.json
      - research/tle_custody/evidence_matrix_C241-L27_2026-11-13.md
      - tools/tle_ssr_editions_precision_audit.py
      - tests/test_tle_ssr_editions_precision_audit.py
      - .github/workflows/tle-ssr-edition-precision.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate exact final HEAD and typed printed precision
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p test_tle_ssr_editions_precision_audit.py -v
          python3 tools/tle_ssr_editions_precision_audit.py --output "$RUNNER_TEMP/c241-l27-ssr-editions.json"
          python3 - "$RUNNER_TEMP/c241-l27-ssr-editions.json" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1]))
          assert x["distinct_compiled_NASA_editions"] == 9
          assert x["linked_compiled_rows"] == 23
          assert x["instrumental_observations_added"] == 0
          assert x["physical_constraints_active"] == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c241-l27-ssr-editions-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l27-ssr-editions.json
          if-no-files-found: warn
