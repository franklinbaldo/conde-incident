name: C241 Agena 2313 crosswalk readiness
on:
  pull_request:
    paths:
      - research/tle_custody/c241_agena_2313_name_claims_20261114.json
      - tools/c241_agena_crosswalk_readiness.py
      - tests/test_c241_agena_crosswalk_readiness.py
      - research/statistics/C241_agena_2313_hardware_crosswalk_readiness.md
      - .github/workflows/c241-agena-crosswalk.yml
  push:
    branches: [main]
    paths:
      - research/tle_custody/c241_agena_2313_name_claims_20261114.json
      - tools/c241_agena_crosswalk_readiness.py
      - tests/test_c241_agena_crosswalk_readiness.py
      - research/statistics/C241_agena_2313_hardware_crosswalk_readiness.md
      - .github/workflows/c241-agena-crosswalk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Execute adversarial test suite
        run: |
          python3 -m unittest discover -s tests -p test_c241_agena_crosswalk_readiness.py -v
          python3 -O -m unittest discover -s tests -p test_c241_agena_crosswalk_readiness.py -v
          python3 -m tools.c241_agena_crosswalk_readiness > "$RUNNER_TEMP/c241-agena-audit.json"
          python3 - "$RUNNER_TEMP/c241-agena-audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["historical_target_rank_gain"] == 0
          assert d["historical_mcmc"] == "NOT_RUN"
          assert not d["historical_constraint_active"]
          assert not d["domain_reduction"]
          PY
