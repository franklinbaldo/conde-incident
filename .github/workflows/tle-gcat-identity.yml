name: Tartaruga - C241-L13 GCAT 527 classification custody
on:
  pull_request:
    paths:
      - tools/tle_gcat_identity_audit.py
      - tests/test_tle_gcat_identity_audit.py
      - research/tle_custody/gcat_identity_527_529_C241-L13.json
      - research/tle_custody/evidence_matrix_C241-L13_2026-11-12.md
      - .github/workflows/tle-gcat-identity.yml
  push:
    branches: [main]
    paths:
      - tools/tle_gcat_identity_audit.py
      - tests/test_tle_gcat_identity_audit.py
      - research/tle_custody/gcat_identity_527_529_C241-L13.json
      - research/tle_custody/evidence_matrix_C241-L13_2026-11-12.md
      - .github/workflows/tle-gcat-identity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gcat-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact HEAD and adversarial synthetic controls
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p 'test_tle_gcat_identity_audit.py' -v
      - name: Download and audit CURRENT mutable GCAT source
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://planet4589.org/space/gcat/data/cat/auxcat.html \
            -o "$RUNNER_TEMP/auxcat.html"
          sha256sum "$RUNNER_TEMP/auxcat.html"
          wc -c "$RUNNER_TEMP/auxcat.html"
          python3 tools/tle_gcat_identity_audit.py \
            --ledger research/tle_custody/gcat_identity_527_529_C241-L13.json \
            --gcat-file "$RUNNER_TEMP/auxcat.html" \
            --output "$RUNNER_TEMP/c241-l13.json"
          python3 - "$RUNNER_TEMP/c241-l13.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r["gcat_row_matches_expected_fields"] is True
          assert len(r["gcat_source_sha256"]) == 64
          assert r["norad_528_engineering_component"] is None
          assert r["norad_529_engineering_component"] is None
          assert r["instrumental_independence"] == "NOT_ESTABLISHED"
          assert r["conde_outcome"] == "INDETERMINATE"
          PY
      - name: Archive provenance and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l13-gcat-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l13.json
          if-no-files-found: warn
          retention-days: 30
