name: C241 fixed-H cross-cutoff conditional falsifier
on:
  pull_request:
    paths:
      - tools/c241_king_hele_fixed_h_falsifier.py
      - tests/test_c241_king_hele_fixed_h_falsifier.py
      - research/statistics/C241_FIXED_H_CROSS_CUTOFF_20261114.md
      - tools/c241_king_hele_day_holdout.py
      - tools/c241_637_regime_holdout.py
      - .github/workflows/c241-fixed-h-day-window.yml
  push:
    branches: [main]
    paths:
      - tools/c241_king_hele_fixed_h_falsifier.py
      - tests/test_c241_king_hele_fixed_h_falsifier.py
      - research/statistics/C241_FIXED_H_CROSS_CUTOFF_20261114.md
      - tools/c241_king_hele_day_holdout.py
      - tools/c241_637_regime_holdout.py
      - .github/workflows/c241-fixed-h-day-window.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-h-conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out SHA
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adversarial tests (normal and optimized)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_c241_king_hele_fixed_h_falsifier.py' -v
          python3 -O -m unittest discover -s tests -p 'test_c241_king_hele_fixed_h_falsifier.py' -v
      - name: Replay original bytes and falsification result
        run: |
          set -euo pipefail
          python3 -m pip install pyarrow==21.0.0
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
            https://huggingface.co/datasets/oxzoid/space-track-tle-history/resolve/4b4fb3a/data/tle_1963.parquet \
            -o "$RUNNER_TEMP/tle_1963.parquet"
          echo 'c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09' " $RUNNER_TEMP/tle_1963.parquet" | sha256sum -c -
          python3 tools/c241_king_hele_fixed_h_falsifier.py \
            --parquet "$RUNNER_TEMP/tle_1963.parquet" \
            --output "$RUNNER_TEMP/c241_fixed_h.json"
          python3 - "$RUNNER_TEMP/c241_fixed_h.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          assert result['source']['sha256_verified_by_reader'] == 'c4bf072a8fc1084506a6146ec79f97d8f8a918fdbe2fabdd16e8cc077f3ddc09'
          assert result['objects']['637']['variants']['last_two']['fixed_H_test']['status'] == 'EMPTY_INTERSECTION_CONDITIONAL_FIXED_H'
          assert result['objects']['637']['variants']['median_three']['fixed_H_test']['status'] == 'EMPTY_INTERSECTION_CONDITIONAL_FIXED_H'
          assert all(result['objects']['637']['variants'][method]['fixed_H_test']['cutoffs_estimable'] == 4 for method in ('last_two','median_three'))
          assert all(result['objects']['528']['variants'][method]['fixed_H_test']['cutoffs_estimable'] == 1 for method in ('last_two','median_three'))
          assert result['inference'] == {
            'active_constraint': False, 'historical_mcmc': 'NOT_RUN',
            'terminal_time_sigma_hours': None, 'impact_geography': None,
            'H_empirically_calibrated': False, 'physical_model_falsified': False,
            'reason': 'only conditional compatibility of frozen approximate proxy and UTC date semantics'
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c241-fixed-h-${{ github.sha }}
          path: ${{ runner.temp }}/c241_fixed_h.json
          if-no-files-found: error
          retention-days: 30
