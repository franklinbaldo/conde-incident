name: Editorial web checks
on:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/storyRoutes.test.mjs tests/storyMarkdown.test.mjs
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: GITHUB_PAGES=true bun run build
