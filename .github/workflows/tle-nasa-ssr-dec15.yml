name: Tartaruga - C241-L21 NASA SSR December 15 1963 documentary custody
on:
  pull_request:
    paths:
      - tools/tle_nasa_ssr_dec15_audit.py
      - tests/test_tle_nasa_ssr_dec15_audit.py
      - research/tle_custody/nasa_ssr_dec15_1963_C241-L21.json
      - research/tle_custody/evidence_matrix_C241-L21_2026-11-13.md
      - research/constraints/ssr_dec15_1963_observables_C241-L21.json
      - .github/workflows/tle-nasa-ssr-dec15.yml
  push:
    branches: [main]
    paths:
      - tools/tle_nasa_ssr_dec15_audit.py
      - tests/test_tle_nasa_ssr_dec15_audit.py
      - research/tle_custody/nasa_ssr_dec15_1963_C241-L21.json
      - research/tle_custody/evidence_matrix_C241-L21_2026-11-13.md
      - research/constraints/ssr_dec15_1963_observables_C241-L21.json
      - .github/workflows/tle-nasa-ssr-dec15.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact HEAD and adversarial validation
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p test_tle_nasa_ssr_dec15_audit.py -v
      - name: Fetch NASA document and audit real captured PDF bytes
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            https://ntrs.nasa.gov/api/citations/19640003479/downloads/19640003479.pdf \
            -o "$RUNNER_TEMP/19640003479.pdf"
          sha256sum "$RUNNER_TEMP/19640003479.pdf"
          wc -c "$RUNNER_TEMP/19640003479.pdf"
          python3 tools/tle_nasa_ssr_dec15_audit.py \
            --ledger research/tle_custody/nasa_ssr_dec15_1963_C241-L21.json \
            --graph research/constraints/ssr_dec15_1963_observables_C241-L21.json \
            --nov15 research/tle_custody/nasa_ssr_nov15_1963_C241-L19.json \
            --jul-dec research/tle_custody/nasa_ssr_jul_dec_1963_C241-L18.json \
            --pdf "$RUNNER_TEMP/19640003479.pdf" \
            --output "$RUNNER_TEMP/c241-l21.json"
          python3 - "$RUNNER_TEMP/c241-l21.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['source_ntrs']=='19640003479'
          assert r['series'][1]['printed_nodal_period_min']==['92.6','92.2','91.6','89.2']
          assert r['physical_constraints_activated']==0
          assert r['independent_instrument_measurements_added']==0
          assert r['conde']=='INDETERMINATE'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c241-l21-dec15-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l21.json
          if-no-files-found: warn
          retention-days: 30
