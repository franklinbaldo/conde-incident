name: NORAD 528 sourced operational elements
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sourced-elements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head SHA
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit secondary literal against operational parameters
        run: python3 -m unittest discover -s tests -p 'test_orbital_constants_provenance.py' -v
