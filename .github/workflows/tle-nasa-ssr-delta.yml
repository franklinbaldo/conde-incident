name: Tartaruga - C241-L11 NASA SSR 1963 edition delta
on:
  pull_request:
    paths:
      - tools/tle_nasa_ssr_delta_audit.py
      - tests/test_tle_nasa_ssr_delta_audit.py
      - research/tle_custody/nasa_ssr_1963_incremental_lineage_C241-L11.json
      - research/tle_custody/evidence_matrix_C241-L11_2026-11-12.md
      - .github/workflows/tle-nasa-ssr-delta.yml
  push:
    branches: [main]
    paths:
      - tools/tle_nasa_ssr_delta_audit.py
      - tests/test_tle_nasa_ssr_delta_audit.py
      - research/tle_custody/nasa_ssr_1963_incremental_lineage_C241-L11.json
      - research/tle_custody/evidence_matrix_C241-L11_2026-11-12.md
      - .github/workflows/tle-nasa-ssr-delta.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nasa-ssr-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source SHA and adversarial tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m unittest discover -s tests -p 'test_tle_nasa_ssr_delta_audit.py' -v
      - name: Download original NASA facsimiles and audit byte custody
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 60 https://ntrs.nasa.gov/api/citations/19640001198/downloads/19640001198.pdf -o "$RUNNER_TEMP/19640001198.pdf"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 https://ntrs.nasa.gov/api/citations/19640002493/downloads/19640002493.pdf -o "$RUNNER_TEMP/19640002493.pdf"
          python3 tools/tle_nasa_ssr_delta_audit.py --ledger research/tle_custody/nasa_ssr_1963_incremental_lineage_C241-L11.json --pdf15 "$RUNNER_TEMP/19640001198.pdf" --pdf30 "$RUNNER_TEMP/19640002493.pdf" --output "$RUNNER_TEMP/c241-l11.json"
          python3 - "$RUNNER_TEMP/c241-l11.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert len(d['checked_source_files']) == 2
          assert [x['bytes'] for x in d['checked_source_files']] == [327613, 1266393]
          assert d['catalog_decay_day_only'] == '1963-11-08'
          assert d['terminal_time_or_position'] is None
          assert d['human_visual_extraction_reproduced_by_ci'] is False
          assert d['conde_outcome'] == 'INDETERMINATE'
          PY
      - name: Archive metadata-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c241-l11-nasa-ssr-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c241-l11.json
          if-no-files-found: warn
          retention-days: 30
